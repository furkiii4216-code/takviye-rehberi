<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Takviye Rehberi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Plus+Jakarta+Sans:wght@600;700;800&family=Source+Sans+3:wght@400;500;600&display=swap">
<style>
html { -webkit-text-size-adjust: 100%; color-scheme: light; }
body { margin: 0; }
[hidden] { display: none !important; }
/* Layout: tek sütun mobil uygulama akışı. Üstte başlık, ortada içerik, altta sekme çubuğu veya "Kullanmaya başla" çubuğu. */
:root {
  --bg: #F1F5F5;
  --surface: #FFFFFF;
  --surface-2: #E8EFEF;
  --ink: #0F2A2E;
  --muted: #4F6468;
  --line: #D3DFE0;
  --accent: #0B6B6F;
  --accent-ink: #FFFFFF;
  --accent-soft: #D7ECEC;
  --warn-bg: #FFF1DC;
  --warn-ink: #6E3800;
  --warn-line: #E6B56B;
  --gap-bg: #EEF0F7;
  --gap-ink: #3A4470;
  --font-display: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1719; --surface: #132226; --surface-2: #1A2D31; --ink: #E4F0F0; --muted: #93AAAD;
    --line: #243A3E; --accent: #5FC4C4; --accent-ink: #072022; --accent-soft: #17383B;
    --warn-bg: #2B2012; --warn-ink: #F2C98A; --warn-line: #5C4520;
    --gap-bg: #1C2036; --gap-ink: #B9C2F0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1719; --surface: #132226; --surface-2: #1A2D31; --ink: #E4F0F0; --muted: #93AAAD;
  --line: #243A3E; --accent: #5FC4C4; --accent-ink: #072022; --accent-soft: #17383B;
  --warn-bg: #2B2012; --warn-ink: #F2C98A; --warn-line: #5C4520;
  --gap-bg: #1C2036; --gap-ink: #B9C2F0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.5;
  padding-block: 0 112px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  background: var(--bg); z-index: 10;
}
.wrap { max-width: 460px; margin: 0 auto; min-width: 0; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
p, ul, ol { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9;
  background: var(--bg); display: flex; align-items: center; gap: 12px;
  padding-block: 14px 10px; min-height: 60px;
}
.brand { font-family: var(--font-display); font-weight: 800; font-size: 18px; letter-spacing: -0.02em; }
.brand span { color: var(--accent); }
.back {
  width: 40px; height: 40px; flex: none; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); display: grid; place-items: center;
}
.top-title { font-family: var(--font-display); font-weight: 700; font-size: 17px; min-width: 0; overflow-wrap: anywhere; }

.screen { display: flex; flex-direction: column; gap: 18px; padding-block: 6px 8px; }
.lead { font-family: var(--font-display); font-weight: 800; font-size: 28px; line-height: 1.15; }
.sub { color: var(--muted); }

/* category cards */
.cats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.cat {
  text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 18px;
  padding: 16px; display: flex; flex-direction: column; gap: 22px; min-height: 124px; min-width: 0;
}
.cat.active { grid-column: 1 / -1; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); min-height: 132px; }
.cat .k { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.8; }
.cat .n { font-family: var(--font-display); font-weight: 800; font-size: 22px; line-height: 1.1; }
.cat.soon { color: var(--muted); background: var(--surface-2); border-style: dashed; cursor: default; }
.cat.soon .n { font-size: 17px; font-weight: 700; }

.note {
  border: 1px solid var(--warn-line); background: var(--warn-bg); color: var(--warn-ink);
  border-radius: 14px; padding: 12px 14px; font-size: 15.5px;
}
.note b { font-weight: 600; }

/* supplement list */
.list { display: flex; flex-direction: column; gap: 12px; }
.card {
  width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface);
  border-radius: 18px; padding: 16px; display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center; min-width: 0;
}
.card h3 { font-size: 19px; }
.card p { color: var(--muted); font-size: 15.5px; grid-column: 1; }
.card .go { grid-row: 1 / span 3; grid-column: 2; color: var(--muted); }
.ev { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.meter { display: inline-flex; gap: 3px; }
.meter i { width: 16px; height: 6px; border-radius: 3px; background: var(--line); display: block; }
.meter i.on { background: var(--accent); }

/* detail */
.hero { display: flex; flex-direction: column; gap: 8px; }
.hero h1 { font-size: 30px; line-height: 1.1; font-weight: 800; }
.alt { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.pipe { display: flex; flex-wrap: wrap; gap: 6px; }
.pill {
  font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px;
  background: var(--accent-soft); color: var(--accent); border: 1px solid transparent;
}
.pill.wait { background: var(--warn-bg); color: var(--warn-ink); border-color: var(--warn-line); }
.block { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.block.warn { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn-ink); }
.block h2 { font-size: 18px; font-weight: 700; }
.block ul { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.block li { padding-left: 16px; position: relative; overflow-wrap: anywhere; }
.block li::before { content: ""; position: absolute; left: 0; top: 0.62em; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.block.warn li::before { background: var(--warn-ink); }
.refs { font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-left: 4px; white-space: nowrap; }
.block.warn .refs { color: var(--warn-ink); opacity: 0.8; }
.tag2 { display: inline-block; margin-left: 6px; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--gap-bg); color: var(--gap-ink); vertical-align: 1px; white-space: nowrap; }
.dose { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; }
.dose .big { font-family: var(--font-mono); font-weight: 500; font-size: 30px; color: var(--accent); line-height: 1.1; }
.dose .per { color: var(--muted); font-size: 15px; }
.gap { background: var(--gap-bg); color: var(--gap-ink); border-radius: 12px; padding: 12px 14px; font-size: 15.5px; }
.srcs { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 12px; counter-reset: s; }
.srcs li { padding-left: 30px; position: relative; font-size: 15.5px; }
.srcs li::before { counter-increment: s; content: counter(s); position: absolute; left: 0; top: 1px; width: 22px; height: 22px; background: var(--surface-2); border-radius: 7px; font-family: var(--font-mono); font-size: 12px; display: grid; place-items: center; }
.srcs a { color: var(--accent); text-underline-offset: 3px; overflow-wrap: anywhere; }
.srcs .t1, .srcs .t2 { font-size: 12px; font-weight: 600; margin-left: 6px; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.srcs .t1 { background: var(--accent-soft); color: var(--accent); }
.srcs .t2 { background: var(--gap-bg); color: var(--gap-ink); }
.fine { font-size: 14px; color: var(--muted); }

/* mine */
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.item-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.item h3 { font-size: 18px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.lbl { font-size: 14px; color: var(--muted); }
input[type="time"] {
  font-family: var(--font-mono); font-size: 18px; padding: 8px 12px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); min-height: 44px;
}
.btn {
  border: 0; border-radius: 14px; min-height: 52px; padding: 0 20px; font-weight: 600; font-size: 17px;
  background: var(--accent); color: var(--accent-ink); font-family: var(--font-display);
}
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.small { min-height: 40px; font-size: 14.5px; padding: 0 14px; border-radius: 12px; }
.btn.full { width: 100%; }
.empty { border: 1px dashed var(--line); border-radius: 18px; padding: 28px 18px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; color: var(--muted); }
.empty h3 { color: var(--ink); font-size: 19px; }

/* bottom bar */
#bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface);
  border-top: 1px solid var(--line);
  padding: 8px max(16px, env(safe-area-inset-left, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px));
}
#bar .in { max-width: 460px; margin: 0 auto; display: flex; gap: 8px; }
.tab {
  flex: 1; border: 0; background: transparent; border-radius: 14px; min-height: 56px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px; font-size: 13px; font-weight: 600; color: var(--muted);
}
.tab[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
.badge { background: var(--accent); color: var(--accent-ink); font-size: 11px; border-radius: 999px; padding: 0 6px; margin-left: 4px; font-family: var(--font-mono); }

/* sheet */
#sheet { position: fixed; inset: 0; z-index: 40; background: rgba(6, 18, 20, 0.55); display: flex; align-items: flex-end; justify-content: center; }
#sheet[hidden] { display: none !important; }
.sheet-in {
  width: 100%; max-width: 460px; background: var(--surface); border-radius: 22px 22px 0 0; border: 1px solid var(--line);
  padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px;
}
.sheet-in h2 { font-size: 22px; font-weight: 800; }
.err { color: var(--warn-ink); background: var(--warn-bg); border-radius: 10px; padding: 8px 12px; font-size: 15px; }
#toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 50;
  background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 14px; font-weight: 600; font-size: 15.5px;
  max-width: min(420px, calc(100vw - 32px)); text-align: center;
}
#toast[hidden] { display: none !important; }
@media (prefers-reduced-motion: no-preference) {
  .card, .cat:not(.soon), .btn, .tab { transition: transform 0.12s ease; }
  .card:active, .cat:not(.soon):active, .btn:active { transform: scale(0.985); }
}
</style>
</head>

</div>
<div id="bar"><div class="in" id="barin"></div></div>
<div id="sheet" hidden></div>
<div id="toast" role="status" hidden></div>

  { id: "diyabet", name: "Diyabet", k: "Hazır", ids: ["ala", "krom"] },
  { id: "tansiyon", name: "Tansiyon", soon: true },

];

var LN = null;
try {
  if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) LN = window.Capacitor.Plugins.LocalNotifications || null;
} catch (e) { LN = null; }

  }).catch(function () { return "error"; });
}
function cancelAlarm(id) {
  if (!LN) return;
  try { LN.cancel({ notifications: [{ id: NID[id] }] }).catch(function () {}); } catch (e) {}
}

var mem = [];

}

  go: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  search: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  pill: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8.5" width="18" height="7" rx="3.5" transform="rotate(-35 12 12)"/><path d="M9.2 7.4l5.6 9.2" /></svg>'
};

function meter(n) { return '<span class="meter" aria-hidden="true">' + [1, 2, 3, 4].map(function (i) { return '<i class="' + (i <= n ? "on" : "") + '"></i>'; }).join("") + "</span>"; }
function refs(a) { return a && a.length ? '<span class="refs">' + a.map(function (n) { return "[" + n + "]"; }).join("") + "</span>" : ""; }
function li(o) { return "<li>" + o.t + refs(o.r) + (o.sec ? '<span class="tag2">ikincil kaynak</span>' : "") + "</li>"; }

function renderTop() {
  if (state.tab === "mine") { $top.innerHTML = '<h1 class="top-title" style="font-size:22px">Takviyelerim</h1>'; return; }
  if (state.view === "home") { $top.innerHTML = '<div class="brand">Takviye<span>Rehberi</span></div>'; return; }
  var title = state.view === "category" ? "Diyabet" : SUPPS[state.supp].name;
  $top.innerHTML = '<button class="back" data-a="back" aria-label="Geri">' + ICON.back + '</button><div class="top-title">' + title + "</div>";
}

function viewHome() {
  var cards = CATS.map(function (c) {
    if (c.soon) return '<div class="cat soon"><span class="k">Yakında</span><span class="n">' + c.name + "</span></div>";
    return '<button class="cat active" data-a="cat" data-id="' + c.id + '"><span class="k">' + c.ids.length + ' takviye · kaynaklı</span><span class="n">' + c.name + "</span></button>";
  }).join("");
  return '<div><h1 class="lead">Hangi konuda bilgi arıyorsun?</h1></div>' +
    '<p class="sub">Her bilginin yanında dayandığı kaynak var. Satış yok, yalnızca bilgi.</p>' +
    '<div class="cats">' + cards + "</div>" +
    '<p class="fine">Bu içerik bilgilendirme amaçlıdır, tıbbi tavsiye yerine geçmez.</p>';
}

function viewCategory() {
  var c = CATS[0];
  var items = c.ids.map(function (id) {
    var s = SUPPS[id];
    return '<button class="card" data-a="supp" data-id="' + id + '"><h3>' + s.name + '</h3><span class="go">' + ICON.go + "</span><p>" + s.summary + '</p><span class="ev">' + meter(s.ev) + s.evLabel + "</span></button>";
  }).join("");
  return '<p class="sub">Kan şekeriyle ilgili takviyeler ve her birinin kanıt düzeyi.</p>' +
    '<div class="note"><b>İlaç kullanıyorsan:</b> insülin veya şeker düşürücü ilaç alıyorsan, takviye eklemeden önce doktoruna ya da eczacına danış.</div>' +
    '<div class="list">' + items + "</div>";
}

function viewDetail() {
  var s = SUPPS[state.supp];
  var srcs = s.sources.map(function (x) {
    return '<li><a href="' + x.u + '" target="_blank" rel="noopener noreferrer">' + x.t + '</a><span class="' + (x.tier === 1 ? "t1" : "t2") + '">' + (x.tier === 1 ? "birincil" : "ikincil") + "</span></li>";
  }).join("");
  var timing = s.timing.gap
    ? '<div class="gap"><b>Eksik bilgi.</b> ' + s.timing.t + refs(s.timing.r) + " Bu alan uzman tarafından doldurulacak.</div>"
    : "<p>" + s.timing.t + refs(s.timing.r) + (s.timing.sec ? '<span class="tag2">ikincil kaynak</span>' : "") + "</p>";
  return '<div class="hero"><h1>' + s.name + '</h1><div class="alt">' + s.alt + '</div><span class="ev">' + meter(s.ev) + s.evLabel + "</span></div>" +
    '<div class="pipe"><span class="pill">Kaynak taraması tamam</span><span class="pill">Kaynaklı yazım tamam</span><span class="pill wait">Uzman onayı bekliyor</span></div>' +
    '<section class="block warn"><h2>Kimler kullanmamalı?</h2><ul>' + s.care.map(li).join("") + "</ul></section>" +
    '<section class="block"><h2>Ne işe yarar?</h2><ul>' + s.does.map(li).join("") + "</ul></section>" +
    '<section class="block"><h2>Doz ne olmalı?</h2><div class="dose"><span class="big">' + s.dose.big + '</span><span class="per">' + s.dose.per + "</span></div><p>" + s.dose.cap + refs(s.dose.r) + "</p><ul>" + s.doseExtra.map(li).join("") + "</ul></section>" +
    '<section class="block"><h2>Aç mı, tok mu?</h2>' + timing + "</section>" +
    '<section class="block"><h2>Kaynaklar</h2><ol class="srcs">' + srcs + '</ol><p class="fine">Birincil: hakemli yayın veya resmi kurum. İkincil: klinik referans, ürün veya blog sayfası; uzman doğrulaması gerekir.</p></section>' +
    '<p class="fine">Bu içerik bilgilendirme amaçlıdır, tıbbi tavsiye yerine geçmez. Başlamadan önce doktoruna veya eczacına danış.</p>';
}

function fmt(t) { return "Her gün " + t; }
function viewMine() {
  if (!mine.length) {
    return '<div class="empty"><h3>Henüz takviye eklemedin</h3><p>Bir takviyenin sayfasında “Kullanmaya başla” dediğinde burada görünür ve hatırlatma saati kurulur.</p><button class="btn small" data-a="tab" data-id="discover">Takviyelere göz at</button></div>';
  }
  var items = mine.map(function (m) {
    var s = SUPPS[m.id];
    return '<div class="item"><div class="item-top"><div><h3>' + s.name + '</h3><div class="lbl">' + fmt(m.time) + ' · alarm açık</div></div><button class="btn ghost small" data-a="remove" data-id="' + m.id + '">Çıkar</button></div>' +
      '<div class="row"><label class="lbl" for="t-' + m.id + '">Hatırlatma saati</label><input type="time" id="t-' + m.id + '" value="' + m.time + '" data-time="' + m.id + '"></div></div>';
  }).join("");
  var warn = mine.length >= 2 ? '<div class="note"><b>Birlikte kullanım:</b> Listendeki takviyelerin ikisi de kan şekerini düşürebilir. Birlikte kullanmadan önce doktoruna danış.</div>' : "";
  return '<p class="sub">Seçtiğin saatte her gün telefonuna hatırlatma bildirimi gelir.</p>' + warn + '<div class="list">' + items + "</div>";
}

function renderBar() {
  if (state.view === "detail" && state.tab === "discover") {
    var m = findMine(state.supp);
    $bar.innerHTML = '<button class="btn full" data-a="start" data-id="' + state.supp + '">' + (m ? "Listende · saati değiştir (" + m.time + ")" : "Kullanmaya başla") + "</button>";
    return;
  }
  $bar.innerHTML =
    '<button class="tab" data-a="tab" data-id="discover"' + (state.tab === "discover" ? ' aria-current="page"' : "") + ">" + ICON.search + "Keşfet</button>" +
    '<button class="tab" data-a="tab" data-id="mine"' + (state.tab === "mine" ? ' aria-current="page"' : "") + ">" + ICON.pill + "<span>Takviyelerim" + (mine.length ? '<span class="badge">' + mine.length + "</span>" : "") + "</span></button>";
}

function render(scroll) {
  renderTop();
  $app.innerHTML = state.tab === "mine" ? viewMine() : state.view === "home" ? viewHome() : state.view === "category" ? viewCategory() : viewDetail();
  renderBar();
  if (scroll) window.scrollTo(0, 0);
}

function toast(msg) {
  $toast.textContent = msg; $toast.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(function () { $toast.hidden = true; }, 2800);
}

function openSheet(id) {
  var s = SUPPS[id], m = findMine(id);
  $sheet.dataset.id = id;
  $sheet.innerHTML = '<div class="sheet-in" role="dialog" aria-modal="true" aria-labelledby="sh-t"><h2 id="sh-t">Hatırlatma kur</h2>' +
    '<p>' + s.name + ' için her gün çalacak saati seç.</p>' +
    '<div class="row"><label class="lbl" for="sheet-time">Saat</label><input type="time" id="sheet-time" value="' + (m ? m.time : s.timing.defTime) + '"></div>' +
    (s.timing.hint ? '<p class="fine">' + s.timing.hint + "</p>" : "") +
    '<div id="sheet-err"></div>' +
    '<button class="btn full" data-a="save">' + (m ? "Saati güncelle" : "Listeme ekle ve alarm kur") + '</button>' +
    '<button class="btn ghost full" data-a="close">Vazgeç</button></div>';
  $sheet.hidden = false;
  var inp = document.getElementById("sheet-time"); if (inp) inp.focus();
}
function closeSheet() { $sheet.hidden = true; $sheet.innerHTML = ""; }

document.addEventListener("click", function (e) {
  if (e.target === $sheet) { closeSheet(); return; }
  var el = e.target.closest("[data-a]"); if (!el) return;
  var a = el.dataset.a, id = el.dataset.id;
  if (a === "cat") { state.view = "category"; render(true); }
  else if (a === "supp") { state.supp = id; state.view = "detail"; render(true); }
  else if (a === "back") { state.view = state.view === "detail" ? "category" : "home"; render(true); }
  else if (a === "tab") { state.tab = id; if (id === "discover" && state.view === "detail") { /* keep place */ } render(true); }
  else if (a === "start") { openSheet(id); }
  else if (a === "close") { closeSheet(); }
  else if (a === "save") {
    var v = document.getElementById("sheet-time").value, sid = $sheet.dataset.id;
    if (!/^\d\d:\d\d$/.test(v)) { document.getElementById("sheet-err").innerHTML = '<div class="err">Önce bir saat seç.</div>'; return; }
    var m = findMine(sid), added = !m;
    if (m) m.time = v; else mine.push({ id: sid, time: v });
    saveMine(); closeSheet(); render(false);
    var okMsg = added ? "Listene eklendi. " + fmt(v) + " hatırlatılacak." : "Saat güncellendi. " + fmt(v);
    scheduleAlarm(sid, v).then(function (r) {
      toast(r === "denied" ? "Listene eklendi ama bildirim izni verilmedi. Telefon ayarlarından izin ver." : r === "error" ? "Listene eklendi ama alarm kurulamadı." : okMsg);
    });
  }
  else if (a === "remove") { mine = mine.filter(function (x) { return x.id !== id; }); saveMine(); cancelAlarm(id); render(false); toast("Listenden çıkarıldı."); }
});
document.addEventListener("change", function (e) {
  var id = e.target && e.target.dataset && e.target.dataset.time; if (!id) return;
  var m = findMine(id); if (!m || !/^\d\d:\d\d$/.test(e.target.value)) return;
  m.time = e.target.value; saveMine(); renderTop(); scheduleAlarm(id, m.time).then(function (r) { toast(r === "denied" ? "Bildirim izni verilmedi. Telefon ayarlarından izin ver." : "Saat güncellendi. " + fmt(m.time)); });
  var lbl = e.target.closest(".item").querySelector(".item-top .lbl"); if (lbl) lbl.textContent = fmt(m.time) + " · alarm açık";
});
document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$sheet.hidden) closeSheet(); });
render(false);
</script>
</body>
</html>
