<style>
html { -webkit-text-size-adjust: 100%; color-scheme: light dark; }
body { margin: 0; }
[hidden] { display: none !important; }

:root {
  --bg: #F1F5F5;
  --surface: #FFFFFF;
  --surface-2: #E8EFEF;
  --ink: #0F2A2E;
  --muted: #4F6468;
  --line: #D3DFE0;
  --accent: #0B6B6F;
  --accent-ink: #FFFFFF;
  --accent-soft: #D7ECEC;
  --warn-bg: #FFF1DC;
  --warn-ink: #6E3800;
  --warn-line: #E6B56B;
  --danger-bg: #FEE2E2;
  --danger-ink: #991B1B;
  --danger-line: #F87171;
  --font-display: "Plus Jakarta Sans", system-ui, sans-serif;
  --font-body: "Source Sans 3", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1719; --surface: #132226; --surface-2: #1A2D31; --ink: #E4F0F0; --muted: #93AAAD;
    --line: #243A3E; --accent: #5FC4C4; --accent-ink: #072022; --accent-soft: #17383B;
    --warn-bg: #2B2012; --warn-ink: #F2C98A; --warn-line: #5C4520;
    --danger-bg: #3B1212; --danger-ink: #FCA5A5; --danger-line: #7F1D1D;
  }
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-block: 0 100px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 500px; margin: 0 auto; min-width: 0; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; letter-spacing: -0.01em; }
p, ul { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }

.top {
  position: sticky; top: 0; z-index: 10;
  background: var(--bg); display: flex; flex-direction: column; gap: 10px;
  padding-block: 12px 10px; border-bottom: 1px solid var(--line);
}
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 20px; }
.brand span { color: var(--accent); }
.back {
  width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); display: grid; place-items: center; flex: none;
}
.top-title { font-family: var(--font-display); font-weight: 700; font-size: 18px; flex: 1; }

.search-box { position: relative; width: 100%; display: flex; align-items: center; }
.search-box input {
  width: 100%; font-family: var(--font-body); font-size: 15px; padding: 10px 14px 10px 38px;
  border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); outline: none;
}
.search-box input:focus { border-color: var(--accent); }
.search-icon { position: absolute; left: 12px; color: var(--muted); pointer-events: none; display: flex; }

.screen { display: flex; flex-direction: column; gap: 16px; padding-block: 12px; }

.auth-tabs { display: flex; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
.auth-tab { flex: 1; padding: 10px; text-align: center; font-weight: 700; color: var(--muted); border-bottom: 2px solid transparent; }
.auth-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

.list { display: flex; flex-direction: column; gap: 10px; }
.card {
  width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface);
  border-radius: 16px; padding: 14px 16px; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center;
}
.card h3 { font-size: 17px; color: var(--ink); }
.card p { color: var(--muted); font-size: 13.5px; grid-column: 1; line-height: 1.35; }
.card .go { grid-row: 1 / span 3; grid-column: 2; color: var(--muted); }
.ev { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); font-weight: 500; }
.meter { display: inline-flex; gap: 3px; }
.meter i { width: 12px; height: 5px; border-radius: 3px; background: var(--line); display: block; }
.meter i.on { background: var(--accent); }

.hero { display: flex; flex-direction: column; gap: 4px; }
.hero h1 { font-size: 24px; font-weight: 800; }
.alt { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.block { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.block.warn { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn-ink); }
.block.good { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.block.danger { background: var(--danger-bg); border-color: var(--danger-line); color: var(--danger-ink); }
.block h2 { font-size: 16px; font-weight: 700; }
.block ul { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.block li { padding-left: 14px; position: relative; font-size: 14.5px; }
.block li::before { content: ""; position: absolute; left: 0; top: 0.6em; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.block.warn li::before { background: var(--warn-ink); }
.block.danger li::before { background: var(--danger-ink); }
.block.good li::before { background: var(--accent); }

.dose { display: flex; align-items: baseline; gap: 8px; }
.dose .big { font-family: var(--font-mono); font-weight: 700; font-size: 24px; color: var(--accent); }
.dose .per { color: var(--muted); font-size: 13.5px; }

.alert-banner {
  background: var(--danger-bg); border: 1px solid var(--danger-line); color: var(--danger-ink);
  border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; font-weight: 600;
}

.item { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.item-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.check-row { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14.5px; font-weight: 600; }
.check-row input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }

input[type="time"], input[type="text"], input[type="password"], input[type="email"], textarea, select {
  font-family: var(--font-body); font-size: 15px; padding: 10px 12px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); outline: none; width: 100%;
}
input:focus, textarea:focus, select:focus { border-color: var(--accent); }

.btn {
  border: 0; border-radius: 12px; min-height: 44px; padding: 0 16px; font-weight: 700; font-size: 15px;
  background: var(--accent); color: var(--accent-ink); font-family: var(--font-display); display: inline-flex; align-items: center; justify-content: center;
}
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.danger { background: var(--danger-bg); color: var(--danger-ink); border: 1px solid var(--danger-line); }
.btn.small { min-height: 34px; font-size: 13px; padding: 0 10px; border-radius: 8px; }
.btn.full { width: 100%; }

#bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface);
  border-top: 1px solid var(--line);
  padding: 8px max(16px, env(safe-area-inset-left, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px));
}
#bar .in { max-width: 500px; margin: 0 auto; display: flex; gap: 8px; }
.tab {
  flex: 1; border: 0; background: transparent; border-radius: 10px; min-height: 48px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 600; color: var(--muted);
}
.tab[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
.badge { background: var(--accent); color: var(--accent-ink); font-size: 11px; border-radius: 999px; padding: 1px 6px; margin-left: 4px; font-family: var(--font-mono); }

#sheet { position: fixed; inset: 0; z-index: 40; background: rgba(6, 18, 20, 0.55); display: flex; align-items: flex-end; justify-content: center; }
#sheet[hidden] { display: none !important; }
.sheet-in {
  width: 100%; max-width: 500px; background: var(--surface); border-radius: 20px 20px 0 0; border: 1px solid var(--line);
  padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; max-height: 80vh; overflow-y: auto;
}

/* EN ÖN PLANDA AÇILAN POPUP / DUYURU PENCERESİ */
#modal-overlay {
  position: fixed; inset: 0; z-index: 100; background: rgba(0, 0, 0, 0.65);
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
#modal-overlay[hidden] { display: none !important; }
.modal-box {
  width: 100%; max-width: 400px; background: var(--surface); border-radius: 20px; border: 1px solid var(--line);
  padding: 24px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
  animation: modalScale 0.2s ease-out;
}
@keyframes modalScale {
  from { transform: scale(0.9); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

#toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 50;
  background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 10px; font-weight: 600; font-size: 13.5px;
  max-width: calc(100vw - 32px); text-align: center;
}
#toast[hidden] { display: none !important; }
.fine { font-size: 13px; color: var(--muted); }
</style>
</head>

function initCloudSync() {
  if (typeof db === "undefined") return;
  db.collection("supplements").onSnapshot(function(snapshot) {
    snapshot.forEach(function(doc) {
      SUPPS[doc.id] = doc.data();
    });
    render(false);
  }, function(err) { console.log(err); });

  // Canlı Duyuru ve Anlık Bildirim Dinleyicisi (En önde popup açar)
  db.collection("announcements").orderBy("date", "desc").limit(1).onSnapshot(function(snapshot) {
    if (!snapshot.empty) {
      var docData = snapshot.docs[0].data();
      // Eğer yeni bir duyuru geldiyse veya sayfa ilk açıldıysa popup göster
      if (!latestAnnouncement || latestAnnouncement.title !== docData.title) {
        latestAnnouncement = docData;
        showPopupModal(docData.title, docData.message);
      }
      render(false);
    }
  }, function(err) { console.log(err); });
}

if (typeof auth !== "undefined") {
  auth.onAuthStateChanged(function(user) {
    currentUser = user;
    if (user) {
      if (!user.emailVerified && user.email !== ADMIN_EMAIL) {
        state.view = "verify_notice";
        document.getElementById("bar").hidden = true;
        render();
        return;
      }
      state.view = "home";
      document.getElementById("bar").hidden = false;
      loadUserData();
      initCloudSync();
      setupPushNotifications();
    } else {
      state.view = "login";
      document.getElementById("bar").hidden = true;
      render();
    }
  });
} else {
  currentUser = { email: "misafir@kullanici.com" };
  state.view = "home";
  initCloudSync();
}

function setupPushNotifications() {
  if (typeof firebase.messaging !== "undefined") {
    try {
      var messaging = firebase.messaging();
      messaging.requestPermission().then(function() {
        return messaging.getToken();
      }).then(function(token) {
        if (token && db) {
          db.collection("fcm_tokens").doc(currentUser.uid).set({ token: token, email: currentUser.email }, { merge: true });
        }
      }).catch(function(err) { console.log("Bildirim izni alınamadı:", err); });
    } catch(e) { console.log(e); }
  }
}

function loadUserData() {
  if(!currentUser) return;
  try {
    mine = JSON.parse(localStorage.getItem("tk_mine_" + currentUser.uid) || "[]");
    myDrugs = JSON.parse(localStorage.getItem("tk_drugs_" + currentUser.uid) || "[]");
  } catch(e) { mine = []; myDrugs = []; }
  render();
}

function saveUserData() {
  if(!currentUser) return;
  try {
    localStorage.setItem("tk_mine_" + currentUser.uid, JSON.stringify(mine));
    localStorage.setItem("tk_drugs_" + currentUser.uid, JSON.stringify(myDrugs));
  } catch(e) {}
}

      '<p style="font-size:14px; margin-top:4px;">' + latestAnnouncement.message + '</p></div>';
  }

  var keys = Object.keys(SUPPS);
  if (state.search.trim() !== "") {
    var q = state.search.toLowerCase();
    keys = keys.filter(function (k) {
      var s = SUPPS[k];
      return s.name.toLowerCase().indexOf(q) !== -1 || (s.summary && s.summary.toLowerCase().indexOf(q) !== -1);
    });
  }
  var items = keys.map(function (id) {
    var s = SUPPS[id];
    return '<button class="card" data-a="supp" data-id="' + id + '">' +
      '<div><h3>' + s.name + '</h3><p>' + (s.summary || "Takviye rehberi verisi.") + '</p><span class="ev">' + meter(s.ev || 3) + (s.evLabel || "Orta") + '</span></div>' +
      '<span class="go">' + ICON.go + '</span></button>';
  }).join("");

  return announceHtml + '<div class="list">' + items + '</div>';
}

function viewMine() {
  var alerts = [];
  INTERACTIONS.forEach(function(item) {
    var hasA = mine.some(function(m){return m.id === item.a;}) || myDrugs.some(function(d){return d.id === item.a;});
    var hasB = mine.some(function(m){return m.id === item.b;}) || myDrugs.some(function(d){return d.id === item.b;});
    if (hasA && hasB) alerts.push(item.msg);
  });

  var alertHtml = alerts.map(function(msg){ return '<div class="alert-banner"><span>' + msg + '</span></div>'; }).join("");
  
  var suppItems = mine.map(function (m) {
    var s = SUPPS[m.id]; if (!s) return "";
    return '<div class="item"><div class="item-top"><div><h3>' + s.name + '</h3><div class="fine">Hatırlatma: ' + m.time + '</div></div>' +
      '<button class="btn ghost small" data-a="remove-supp" data-id="' + m.id + '">Çıkar</button></div>' +
      '<label class="check-row"><input type="checkbox" data-a="toggle-done-supp" data-id="' + m.id + '" ' + (m.done ? "checked" : "") + '> Bugün Aldım</label></div>';
  }).join("");

  var drugItems = myDrugs.map(function (d) {
    var dr = DRUGS[d.id]; if (!dr) return "";
    return '<div class="item" style="border-left:4px solid var(--accent);"><div class="item-top"><div><h3>' + dr.name + '</h3><div class="fine">' + dr.group + ' · Saat: ' + d.time + '</div></div>' +
      '<button class="btn ghost small" data-a="remove-drug" data-id="' + d.id + '">Çıkar</button></div>' +
      '<label class="check-row"><input type="checkbox" data-a="toggle-done-drug" data-id="' + d.id + '" ' + (d.done ? "checked" : "") + '> Bugün Aldım</label></div>';
  }).join("");

  return alertHtml +
    '<div style="display:flex; justify-content:space-between; align-items:center;">' +
    '<p style="font-weight:700;">Günlük Rutinim:</p><button class="btn small" data-a="open-drug-sheet">+ İlaç / Etken Madde Ekle</button></div>' +
    '<div class="list">' + suppItems + drugItems + '</div>' +
    '<div style="margin-top:16px; text-align:center;"><button class="btn ghost small" data-a="logout">Oturumu Kapat (' + (currentUser ? currentUser.email : '') + ')</button></div>';
}

function render(scroll) {
  if (state.view === "login") { $top.innerHTML = ''; $app.innerHTML = viewLogin(); document.getElementById("bar").hidden = true; return; }
  if (state.view === "verify_notice") { $top.innerHTML = ''; $app.innerHTML = viewVerifyNotice(); document.getElementById("bar").hidden = true; return; }
  renderTop();
  if (state.view === "admin") { $app.innerHTML = viewAdmin(); }
  else if (state.view === "edit_supp") { $app.innerHTML = viewEditSupp(); }
  else { $app.innerHTML = state.tab === "mine" ? viewMine() : state.view === "home" ? viewHome() : viewDetail(); }
  renderBar();
  if (scroll) window.scrollTo(0, 0);

  var inp = document.getElementById("search-input");
  if (inp) {
    inp.addEventListener("input", function (e) {
      state.search = e.target.value;
      $app.innerHTML = viewHome();
    });
  }
}

function toast(msg) {
  $toast.textContent = msg; $toast.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(function () { $toast.hidden = true; }, 2600);
}

/* EN ÖN PLANDA AÇILAN POPUP MODAL (TAMAMA BASINCA KAYBOLUR) */
function showPopupModal(title, message) {
  $modal.innerHTML = '<div class="modal-box">' +
    '<h3 style="color:var(--accent);">📢 ' + title + '</h3>' +
    '<p style="font-size:14.5px; line-height:1.4;">' + message + '</p>' +
    '<button class="btn full" data-a="close-modal">Tamam</button>' +
    '</div>';
  $modal.hidden = false;
}

function openSheet(id) {
  var s = SUPPS[id], m = mine.find(function(x){return x.id===id;});
  $sheet.dataset.id = id;
  $sheet.innerHTML = '<div class="sheet-in"><h2>Hatırlatma Saati Ayarla</h2>' +
    '<p class="fine">' + (s ? s.name : "") + '</p>' +
    '<input type="time" id="sheet-time" value="' + (m ? m.time : "09:00") + '">' +
    '<button class="btn full" data-a="save-supp">Kaydet</button>' +
    '<button class="btn ghost full" data-a="close">Vazgeç</button></div>';
  $sheet.hidden = false;
}

function openDrugSheet() {
  var drugListHtml = Object.keys(DRUGS).map(function(k) {
    var d = DRUGS[k];
    return '<button class="card" data-a="add-drug-item" data-id="' + k + '" style="padding:10px 12px; margin-bottom:4px;">' +
      '<div><h3 style="font-size:15px;">' + d.name + '</h3><p class="fine">' + d.desc + '</p></div><span class="btn small">Ekle</span></button>';
  }).join("");

    '<button class="btn ghost full" data-a="close">Kapat</button></div>';

function openDrugTimeSheet(did) {
  $sheet.dataset.drugid = did;
  $sheet.innerHTML = '<div class="sheet-in"><h2>İlaç Kullanım Saati</h2><input type="time" id="drug-sheet-time" value="08:00">' +
    '<button class="btn full" data-a="save-drug">Kaydet</button></div>';

}

document.addEventListener("click", function (e) {
  if (e.target === $sheet) { $sheet.hidden = true; return; }
  if (e.target === $modal) { $modal.hidden = true; return; }
  var el = e.target.closest("[data-a]"); if (!el) return;
  var a = el.dataset.a, id = el.dataset.id;

  if (a === "close-modal") { $modal.hidden = true; }
  else if (a === "show-latest-announcement") {
    if (latestAnnouncement) { showPopupModal(latestAnnouncement.title, latestAnnouncement.message); }
  }
  else if (a === "switch-auth") { state.authMode = el.dataset.mode; render(false); }
  else if (a === "do-login" || a === "do-register") {
    var email = document.getElementById("log-email").value;
    var pass = document.getElementById("log-pass").value;

    if(!email || !pass) { document.getElementById("log-err").textContent = "Lütfen alanları doldurunuz."; return; }
    
    if (a === "do-register") {
      var pass2 = document.getElementById("log-pass2").value;
      var legalChecked = document.getElementById("legal-check").checked;
      if (pass !== pass2) { document.getElementById("log-err").textContent = "Şifreler birbiriyle eşleşmiyor."; return; }
      if (!legalChecked) { document.getElementById("log-err").textContent = "Lütfen yasal bilgilendirmeyi onaylayınız."; return; }

      auth.createUserWithEmailAndPassword(email, pass).then(function(cred) {
        cred.user.sendEmailVerification().then(function() { toast("Doğrulama maili gönderildi!"); });
      }).catch(function(err){ document.getElementById("log-err").textContent = err.message; });
    } else {
      auth.signInWithEmailAndPassword(email, pass).catch(function(err){ document.getElementById("log-err").textContent = err.message; });
    }
  }
  else if (a === "resend-verify") {
    if (auth && auth.currentUser) {
      auth.currentUser.sendEmailVerification().then(function() { toast("Doğrulama bağlantısı iletildi."); });
    }
  }
  else if (a === "logout") {
    if (typeof auth !== "undefined") { auth.signOut(); }
    currentUser = null; state.view = "login"; document.getElementById("bar").hidden = true; render();
  }
  else if (a === "go-admin") {
    if (!currentUser || currentUser.email !== ADMIN_EMAIL) { toast("Bu alana yalnızca yönetici erişebilir."); return; }
    state.view = "admin"; render(true);
  }
  else if (a === "supp") { state.supp = id; state.view = "detail"; render(true); }
  else if (a === "back" || a === "back-to-home") { state.view = "home"; render(true); }
  else if (a === "tab") { state.tab = id; if(id==='discover') state.view='home'; render(true); }
  else if (a === "start") { openSheet(id); }
  else if (a === "open-drug-sheet") { openDrugSheet(); }
  else if (a === "add-drug-item") { openDrugTimeSheet(id); }
  else if (a === "close") { $sheet.hidden = true; }
  else if (a === "start-edit") {
    if (!currentUser || currentUser.email !== ADMIN_EMAIL) { toast("Yalnızca yönetici düzenleme yapabilir."); return; }
    state.editId = id || state.supp;
    state.view = "edit_supp";
    render(true);
  }
  else if (a === "add-extra-block") {
    var s = SUPPS[state.editId];
    if (!s.extraBlocks) s.extraBlocks = [];
    s.extraBlocks.push({ title: "Yeni Başlık", theme: "good", items: ["Madde 1", "Madde 2"] });
    render(false);
  }
  else if (a === "remove-extra-block") {
    var idx = parseInt(el.dataset.idx);
    var s = SUPPS[state.editId];
    if (s && s.extraBlocks) {
      s.extraBlocks.splice(idx, 1);
      render(false);
    }
  }
  else if (a === "send-broadcast") {
    if (!currentUser || currentUser.email !== ADMIN_EMAIL) return;
    var bTitle = document.getElementById("adm-notif-title").value;
    var bMsg = document.getElementById("adm-notif-msg").value;
    if (!bTitle || !bMsg) { alert("Lütfen başlık ve mesaj giriniz."); return; }

    var annData = {
      title: bTitle,
      message: bMsg,
      date: firebase.firestore.FieldValue.serverTimestamp(),
      timeStr: new Date().toLocaleDateString("tr-TR") + " " + new Date().toLocaleTimeString("tr-TR", {hour: '2-digit', minute:'2-digit'})
    };

    if (typeof db !== "undefined") {
      db.collection("announcements").add(annData).then(function() {
        toast("Duyuru yayınlandı ve kullanıcılara iletildi!");
        document.getElementById("adm-notif-title").value = "";
        document.getElementById("adm-notif-msg").value = "";
      }).catch(function(err) { alert("Hata: " + err.message); });
    }
  }
  else if (a === "update-supp-submit") {
    if (!currentUser || currentUser.email !== ADMIN_EMAIL) return;
    var sName = document.getElementById("edit-name").value;
    if(!sName) { alert("Takviye adı boş olamaz."); return; }
    var sAlt = document.getElementById("edit-alt").value || "";
    var sSummary = document.getElementById("edit-summary").value || "";
    var sEv = parseInt(document.getElementById("edit-ev").value) || 3;
    var sDoseBig = document.getElementById("edit-dose-big").value || "1 Doz";
    
    var sWho = document.getElementById("edit-who").value.split(",").map(function(s){return s.trim();}).filter(Boolean);
    var sCare = document.getElementById("edit-care").value.split(",").map(function(s){return s.trim();}).filter(Boolean);
    var sDoes = document.getElementById("edit-does").value.split(",").map(function(s){return s.trim();}).filter(Boolean);

    var collectedBlocks = [];
    var blockEls = document.querySelectorAll("#extra-blocks-container [data-block-idx]");
    blockEls.forEach(function(bEl) {
      var tInput = bEl.querySelector(".eb-title").value;
      var thSelect = bEl.querySelector(".eb-theme").value;
      var itemsInput = bEl.querySelector(".eb-items").value.split(",").map(function(s){return s.trim();}).filter(Boolean);
      collectedBlocks.push({ title: tInput || "Özel Başlık", theme: thSelect, items: itemsInput });
    });

    var existingData = SUPPS[state.editId] || {};
    var updatedSuppData = Object.assign({}, existingData, {
      name: sName,
      alt: sAlt,
      summary: sSummary,
      ev: sEv,
      evLabel: sEv === 4 ? "Çok güçlü" : "Orta-Güçlü",
      dose: Object.assign({}, existingData.dose, { big: sDoseBig }),
      who: sWho.length ? sWho : ["Genel kullanım"],
      care: sCare.length ? sCare : ["Uzmanına danışınız."],
      does: sDoes.length ? sDoes : ["Destekleyici etki sağlar."],
      extraBlocks: collectedBlocks
    });

    if (typeof db !== "undefined") {
      db.collection("supplements").doc(state.editId).set(updatedSuppData, { merge: true }).then(function() {
        SUPPS[state.editId] = updatedSuppData;
        toast("Tüm şablonlar ve ek bloklar yayınlandı!");
        state.view = "home";
        render(true);
      }).catch(function(error) { alert("Güncelleme hatası: " + error.message); });
    }
  }
  else if (a === "save-supp") {
    var v = document.getElementById("sheet-time").value, sid = $sheet.dataset.id;
    var m = mine.find(function(x){return x.id===sid;});
    if (m) m.time = v; else mine.push({ id: sid, time: v, done: false });
    saveUserData(); $sheet.hidden = true; render(false); toast("Listeye eklendi.");
  }
  else if (a === "save-drug") {
    var v2 = document.getElementById("drug-sheet-time").value, did = $sheet.dataset.drugid;
    var d = myDrugs.find(function(x){return x.id===did;});
    if (d) d.time = v2; else myDrugs.push({ id: did, time: v2, done: false });
    saveUserData(); $sheet.hidden = true; render(false); toast("İlaç eklendi.");
  }
  else if (a === "remove-supp") { mine = mine.filter(function(x){return x.id!==id;}); saveUserData(); render(false); }
  else if (a === "remove-drug") { myDrugs = myDrugs.filter(function(x){return x.id!==id;}); saveUserData(); render(false); }
  else if (a === "toggle-done-supp") { var m2 = mine.find(function(x){return x.id===id;}); if(m2){m2.done=e.target.checked; saveUserData();} }
  else if (a === "toggle-done-drug") { var d2 = myDrugs.find(function(x){return x.id===id;}); if(d2){d2.done=e.target.checked; saveUserData();} }
  else if (a === "save-new-supp") {
    if (!currentUser || currentUser.email !== ADMIN_EMAIL) return;
    var sName = document.getElementById("adm-name").value;
    if(!sName) { alert("Lütfen takviye adı giriniz."); return; }
    var sAlt = document.getElementById("adm-alt").value || "Özel Formül";
    var sSummary = document.getElementById("adm-summary").value || "Kişiselleştirilmiş destek ürünü.";
    var sEv = parseInt(document.getElementById("adm-ev").value) || 3;
    var sDoseBig = document.getElementById("adm-dose-big").value || "1 Doz";
    
    var sWho = document.getElementById("adm-who").value.split(",").map(function(s){return s.trim();}).filter(Boolean);
    if(sWho.length === 0) sWho = ["Genel yaşam kalitesini artırmak isteyenler"];
    var sCare = document.getElementById("adm-care").value.split(",").map(function(s){return s.trim();}).filter(Boolean);
    if(sCare.length === 0) sCare = ["Aksini belirtmedikçe uzman önerisiyle kullanılmalıdır."];
    var sDoes = document.getElementById("adm-does").value.split(",").map(function(s){return s.trim();}).filter(Boolean);
    if(sDoes.length === 0) sDoes = ["Metabolik süreçleri destekler."];

    var sKey = "supp_custom_" + Date.now();
    var newSuppData = {
      name: sName, alt: sAlt, summary: sSummary, ev: sEv,
      evLabel: sEv === 4 ? "Çok güçlü" : "Orta-Güçlü",
      who: sWho,
      care: sCare,
      does: sDoes,
      dose: { big: sDoseBig, per: "günde" },
      extraBlocks: []
    };

    if (typeof db !== "undefined") {
      db.collection("supplements").doc(sKey).set(newSuppData).then(function() {
        toast("Başarıyla veritabanına kaydedildi!");
        state.view = "home"; render(true);
      }).catch(function(error) { alert("Bulut kayıt hatası: " + error.message); });
    }
  }
  else if (a === "delete-cloud-supp") {
    if (!currentUser || currentUser.email !== ADMIN_EMAIL) return;
    if (confirm("Bu takviyeyi veritabanından silmek istediğinize emin misiniz?")) {
      if (typeof db !== "undefined") {
        db.collection("supplements").doc(id).delete().then(function() {
          delete SUPPS[id];
          toast("Takviye silindi.");
          render(false);
        });
      }
    }
  }
});

render(false);
</script>
</body>
</html>
