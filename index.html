<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Takviye & İlaç Rehberi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Plus+Jakarta+Sans:wght@600;700;800&family=Source+Sans+3:wght@400;500;600&display=swap">
<style>
html { -webkit-text-size-adjust: 100%; color-scheme: light; }
body { margin: 0; }
[hidden] { display: none !important; }

:root {
  --bg: #F1F5F5;
  --surface: #FFFFFF;
  --surface-2: #E8EFEF;
  --ink: #0F2A2E;
  --muted: #4F6468;
  --line: #D3DFE0;
  --accent: #0B6B6F;
  --accent-ink: #FFFFFF;
  --accent-soft: #D7ECEC;
  --warn-bg: #FFF1DC;
  --warn-ink: #6E3800;
  --warn-line: #E6B56B;
  --danger-bg: #FEE2E2;
  --danger-ink: #991B1B;
  --danger-line: #F87171;
  --font-display: "Plus Jakarta Sans", system-ui, sans-serif;
  --font-body: "Source Sans 3", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1719; --surface: #132226; --surface-2: #1A2D31; --ink: #E4F0F0; --muted: #93AAAD;
    --line: #243A3E; --accent: #5FC4C4; --accent-ink: #072022; --accent-soft: #17383B;
    --warn-bg: #2B2012; --warn-ink: #F2C98A; --warn-line: #5C4520;
    --danger-bg: #3B1212; --danger-ink: #FCA5A5; --danger-line: #7F1D1D;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.5;
  padding-block: 0 112px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 480px; margin: 0 auto; min-width: 0; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; letter-spacing: -0.01em; }
p, ul, ol { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

.top {
  position: sticky; top: 0; z-index: 10;
  background: var(--bg); display: flex; flex-direction: column; gap: 10px;
  padding-block: 12px 10px; border-bottom: 1px solid var(--line);
}
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 20px; }
.brand span { color: var(--accent); }
.back {
  width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); display: grid; place-items: center; flex: none;
}
.top-title { font-family: var(--font-display); font-weight: 700; font-size: 18px; flex: 1; }

.search-box { position: relative; width: 100%; display: flex; align-items: center; }
.search-box input {
  width: 100%; font-family: var(--font-body); font-size: 16px; padding: 10px 14px 10px 38px;
  border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); outline: none;
}
.search-box input:focus { border-color: var(--accent); }
.search-icon { position: absolute; left: 12px; color: var(--muted); pointer-events: none; display: flex; }

.screen { display: flex; flex-direction: column; gap: 16px; padding-block: 12px; }

.list { display: flex; flex-direction: column; gap: 12px; }
.card {
  width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface);
  border-radius: 18px; padding: 16px; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center;
}
.card h3 { font-size: 18px; color: var(--ink); }
.card p { color: var(--muted); font-size: 14.5px; grid-column: 1; line-height: 1.35; }
.card .go { grid-row: 1 / span 3; grid-column: 2; color: var(--muted); }
.ev { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--muted); font-weight: 500; }
.meter { display: inline-flex; gap: 3px; }
.meter i { width: 14px; height: 5px; border-radius: 3px; background: var(--line); display: block; }
.meter i.on { background: var(--accent); }

.hero { display: flex; flex-direction: column; gap: 6px; }
.hero h1 { font-size: 26px; font-weight: 800; }
.alt { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.block { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.block.warn { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn-ink); }
.block.good { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.block h2 { font-size: 17px; font-weight: 700; }
.block ul { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.block li { padding-left: 16px; position: relative; font-size: 15.5px; }
.block li::before { content: ""; position: absolute; left: 0; top: 0.6em; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.block.warn li::before { background: var(--warn-ink); }

.dose { display: flex; align-items: baseline; gap: 8px; }
.dose .big { font-family: var(--font-mono); font-weight: 700; font-size: 26px; color: var(--accent); }
.dose .per { color: var(--muted); font-size: 14px; }

.srcs { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 8px; counter-reset: s; }
.srcs li { padding-left: 28px; position: relative; font-size: 14px; }
.srcs li::before { counter-increment: s; content: counter(s); position: absolute; left: 0; top: 2px; width: 20px; height: 20px; background: var(--surface-2); border-radius: 6px; font-family: var(--font-mono); font-size: 11px; display: grid; place-items: center; }
.srcs a { color: var(--accent); text-decoration: none; font-weight: 500; }

.alert-banner {
  background: var(--danger-bg); border: 1px solid var(--danger-line); color: var(--danger-ink);
  border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 6px; font-size: 14.5px; font-weight: 600;
}

.item { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.item-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.check-row { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 15px; font-weight: 600; }
.check-row input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer; }

input[type="time"] {
  font-family: var(--font-mono); font-size: 16px; padding: 6px 10px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink);
}
.btn {
  border: 0; border-radius: 14px; min-height: 48px; padding: 0 18px; font-weight: 700; font-size: 16px;
  background: var(--accent); color: var(--accent-ink); font-family: var(--font-display); display: inline-flex; align-items: center; justify-content: center;
}
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.small { min-height: 38px; font-size: 14px; padding: 0 12px; border-radius: 10px; }
.btn.full { width: 100%; }

#bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface);
  border-top: 1px solid var(--line);
  padding: 8px max(16px, env(safe-area-inset-left, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px));
}
#bar .in { max-width: 480px; margin: 0 auto; display: flex; gap: 8px; }
.tab {
  flex: 1; border: 0; background: transparent; border-radius: 12px; min-height: 52px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px; font-size: 12.5px; font-weight: 600; color: var(--muted);
}
.tab[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
.badge { background: var(--accent); color: var(--accent-ink); font-size: 11px; border-radius: 999px; padding: 1px 6px; margin-left: 4px; font-family: var(--font-mono); }

#sheet { position: fixed; inset: 0; z-index: 40; background: rgba(6, 18, 20, 0.55); display: flex; align-items: flex-end; justify-content: center; }
#sheet[hidden] { display: none !important; }
.sheet-in {
  width: 100%; max-width: 480px; background: var(--surface); border-radius: 22px 22px 0 0; border: 1px solid var(--line);
  padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; max-height: 80vh; overflow-y: auto;
}
#toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(88px + env(safe-area-inset-bottom, 0px)); z-index: 50;
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14.5px;
  max-width: calc(100vw - 32px); text-align: center;
}
#toast[hidden] { display: none !important; }
.fine { font-size: 13.5px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <div id="top" class="top"></div>
  <main id="app" class="screen"></main>
</div>
<div id="bar"><div class="in" id="barin"></div></div>
<div id="sheet" hidden></div>
<div id="toast" role="status" hidden></div>

  egcg: { name: "Yeşil Çay Ekstresi (EGCG)", alt: "Green Tea Extract", summary: "Metabolizma ve yağ yakımı.", ev: 3, evLabel: "Orta-Güçlü", who: ["Kilo kontrolü yapanlar"], care: ["Aç karnına karaciğeri yorabilir."], does: ["Metabolizmayı hızlandırır."], dose: { big: "250-500 mg", per: "günde" }, timing: "Tok karnına.", sources: [{ t: "PubMed: EGCG", u: "https://pubmed.ncbi.nlm.nih.gov/" }] },
  nac: { name: "NAC (N-Asetilsistein)", alt: "Acetylcysteine", summary: "Glutatyon öncüsü ve mukolitik.", ev: 3, evLabel: "Orta-Güçlü", who: ["Akciğer ve karaciğer desteği arayanlar"], care: ["Astım hastaları dikkat etmeli."], does: ["Glutatyon sentezler."], dose: { big: "600-1200 mg", per: "günde" }, timing: "Bol suyla.", sources: [{ t: "PubMed: NAC", u: "https://pubmed.ncbi.nlm.nih.gov/" }] },
  selenium: { name: "Selenyum", alt: "L-Selenomethionine", summary: "Tiroid hormonu ve bağışıklık.", ev: 3, evLabel: "Orta-Güçlü", who: ["Hashimoto tiroiditi olanlar"], care: ["Günde 400 mcg üzeri toksiktir."], does: ["T4'ü T3'e çevirir."], dose: { big: "100-200 mcg", per: "günde" }, timing: "Yemekle.", sources: [{ t: "NIH Selenium", u: "https://ods.od.nih.gov/" }] },
  rhodiola: { name: "Rodiola Rosea", alt: "Golden root", summary: "Zihinsel yorgunluk ve adaptasyon.", ev: 3, evLabel: "Orta-Güçlü", who: ["Yoğun stres altındakiler"], care: ["Bipolarda maniyi tetikleyebilir."], does: ["Zihinsel sisi giderir."], dose: { big: "200-400 mg", per: "günde" }, timing: "Sabah aç karnına.", sources: [{ t: "PubMed: Rhodiola", u: "https://pubmed.ncbi.nlm.nih.gov/" }] }
};

// Türkiye'de En Sık Kullanılan İlaç Veritabanı (Sadece Profil & Etkileşim İçin)
var DRUGS = {
  glifor: { name: "Glifor / Glucophage (Metformin)", group: "Şeker İlacı", desc: "Tip 2 Diyabet ve insülin direnci ilacı." },
  euthyrox: { name: "Euthyrox / Levotron (Levotiroksin)", group: "Tiroid İlacı", desc: "Tiroid hormon replasmanı." },
  kumadin: { name: "Kumadin (Varfarin / Kan Sulandırıcı)", group: "Antikoagülan", desc: "Kan pıhtılaşmasını önleyen ilaç." },
  coraspin: { name: "Coraspin / Aspirin (Asetilsalisilik Asit)", group: "Antiplatelet", desc: "Kan sulandırıcı düşük doz aspirin." },
  suscaps: { name: "Ecorex / Plavix (Klopidogrel)", group: "Kan Sulandırıcı", desc: "Kan pulcuklarını engelleyici." },
  glucotrol: { name: "Gliclazide / Amaryl (Sülfonilüre)", group: "Şeker İlacı", desc: "Pankreastan insülin salgılatan şeker ilacı." },
  crestor: { name: "Crestor / Lipitor (Statinler)", group: "Kolesterol İlacı", desc: "Kolesterol düşürücü ilaç grubu." },
  norvasc: { name: "Norvasc / Dilatrend (Tansiyon İlacı)", group: "Antihipertansif", desc: "Hipertansiyon ve kalp ilacı." }
};

// ETKİLEŞİM KURALLARI MOTORU (Klinik Eczacılık Kuralları)
var INTERACTIONS = [
  {
    a: "ala", b: "glifor", type: "danger",
    msg: "⚠️ Ciddi Etkileşim: Alfa Lipoik Asit ile Metformin (Şeker İlacı) birlikte kullanıldığında kan şekerini aşırı düşürebilir (hipoglisemi riski). Kan şekerinizi sıkı takip edin!"
  },
  {
    a: "berberin", b: "glifor", type: "danger",
    msg: "⚠️ Ciddi Etkileşim: Berberin ve Şeker İlacı eşzamanlı alındığında glikoz seviyesini kritik düzeyde düşürebilir."
  },
  {
    a: "ginkgo", b: "kumadin", type: "danger",
    msg: "⚠️ Kritik Kanama Riski: Ginkgo Biloba kanı sulandırıcı etkiyi artırarak kanama riskini ciddi oranda yükseltir!"
  },
  {
    a: "omega3", b: "kumadin", type: "warn",
    msg: "⚠️ Dikkat: Omega-3 yüksek dozda kan sulandırıcı (Kumadin/Coraspin) ilaçların etkisini potansiyalize edebilir (kanama riski)."
  },
  {
    a: "k2", b: "kumadin", type: "danger",
    msg: "⚠️ Kontrendikasyon: K2 Vitamini, kan sulandırıcı ilaçların (Kumadin) etkisini tamamen bloke eder! Doktor onaysız asla birlikte kullanmayın."
  },
  {
    a: "mg", b: "euthyrox", type: "warn",
    msg: "⚠️ Emilim Azalması: Magnezyum ile Tiroid İlacı (Euthyrox) aynı anda alınırsa ilacın emilimi engellenir. Aralarında en az 4 saat bırakın."
  },
  {
    a: "zinko", b: "euthyrox", type: "warn",
    msg: "⚠️ Emilim Azalması: Çinko ve Tiroid ilacı eşzamanlı alınmamalıdır, en az 3-4 saat ara verin."
  }
];

// Uygulama Durumu
var state = { tab: "discover", view: "home", supp: null, search: "", drugSearch: "" };
var mine = loadMine(); // [{id: 'ala', type: 'supp', time: '09:00', done: false}]
var myDrugs = loadDrugs(); // [{id: 'glifor', time: '08:00', done: false}]

function loadMine() {
  try { var v = JSON.parse(localStorage.getItem("tk_mine") || "[]"); return Array.isArray(v) ? v : []; } catch (e) { return []; }
}
function saveMine() { try { localStorage.setItem("tk_mine", JSON.stringify(mine)); } catch (e) {} }
function findMine(id) { for (var i = 0; i < mine.length; i++) if (mine[i].id === id) return mine[i]; return null; }

function loadDrugs() {
  try { var v = JSON.parse(localStorage.getItem("tk_drugs") || "[]"); return Array.isArray(v) ? v : []; } catch (e) { return []; }
}
function saveDrugs() { try { localStorage.setItem("tk_drugs", JSON.stringify(myDrugs)); } catch (e) {} }
function findDrug(id) { for (var i = 0; i < myDrugs.length; i++) if (myDrugs[i].id === id) return myDrugs[i]; return null; }

var $app = document.getElementById("app"), $top = document.getElementById("top"), $bar = document.getElementById("barin"),
    $sheet = document.getElementById("sheet"), $toast = document.getElementById("toast"), toastT;

var ICON = {
  back: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>',
  go: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>',
  search: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  pill: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="8.5" width="18" height="7" rx="3.5" transform="rotate(-35 12 12)"/><path d="M9.2 7.4l5.6 9.2" /></svg>'
};

function meter(n) {
  return '<span class="meter" aria-hidden="true">' + [1, 2, 3, 4].map(function (i) { return '<i class="' + (i <= n ? "on" : "") + '"></i>'; }).join("") + "</span>";
}

function renderTop() {
  if (state.tab === "mine") {
    $top.innerHTML = '<div class="top-row"><h1 class="brand">Kullandıklarım & <span>Etkileşim</span></h1></div>';
    return;
  }
  if (state.view === "home") {
    $top.innerHTML = '<div class="top-row"><div class="brand">Takviye<span>Rehberi</span></div></div>' +
      '<div class="search-box"><span class="search-icon">' + ICON.search + '</span>' +
      '<input type="text" id="search-input" placeholder="Takviye adı veya etken madde ara..." value="' + state.search + '"></div>';
    return;
  }
  var title = SUPPS[state.supp] ? SUPPS[state.supp].name : "";
  $top.innerHTML = '<div class="top-row"><button class="back" data-a="back" aria-label="Geri">' + ICON.back + '</button><div class="top-title">' + title + '</div></div>';
}

function viewHome() {
  var keys = Object.keys(SUPPS);
  if (state.search.trim() !== "") {
    var q = state.search.toLowerCase();
    keys = keys.filter(function (k) {
      var s = SUPPS[k];
      return s.name.toLowerCase().indexOf(q) !== -1 || s.alt.toLowerCase().indexOf(q) !== -1 || s.summary.toLowerCase().indexOf(q) !== -1;
    });
  }

  if (keys.length === 0) {
    return '<div class="empty" style="text-align:center; padding: 40px 10px; color: var(--muted);">' +
      '<h3>Aramanıza uygun takviye bulunamadı</h3><p>Farklı bir kelime ile tekrar arayabilirsiniz.</p></div>';
  }

  var items = keys.map(function (id) {
    var s = SUPPS[id];
    return '<button class="card" data-a="supp" data-id="' + id + '">' +
      '<div><h3>' + s.name + '</h3><p>' + s.summary + '</p><span class="ev">' + meter(s.ev) + s.evLabel + '</span></div>' +
      '<span class="go">' + ICON.go + '</span></button>';
  }).join("");

  return '<div class="list">' + items + '</div><p class="fine" style="text-align:center;">Toplam ' + keys.length + ' takviye listeleniyor.</p>';
}

function viewDetail() {
  var s = SUPPS[state.supp];
  var whoLi = s.who.map(function (t) { return '<li>' + t + '</li>'; }).join("");
  var careLi = s.care.map(function (t) { return '<li>' + t + '</li>'; }).join("");
  var doesLi = s.does.map(function (t) { return '<li>' + t + '</li>'; }).join("");
  var srcs = s.sources.map(function (x) { return '<li><a href="' + x.u + '" target="_blank" rel="noopener">' + x.t + '</a></li>'; }).join("");

  return '<div class="hero"><h1>' + s.name + '</h1><div class="alt">' + s.alt + '</div><span class="ev">' + meter(s.ev) + s.evLabel + '</span></div>' +
    '<section class="block good"><h2>Kimler Kullanabilir? (Endikasyonlar)</h2><ul>' + whoLi + '</ul></section>' +
    '<section class="block warn"><h2>Kimler Kullanmamalı / Uyarılar</h2><ul>' + careLi + '</ul></section>' +
    '<section class="block"><h2>Ne İşe Yarar?</h2><ul>' + doesLi + '</ul></section>' +
    '<section class="block"><h2>Doz ve Kullanım</h2><div class="dose"><span class="big">' + s.dose.big + '</span><span class="per">' + s.dose.per + '</span></div></section>' +
    '<section class="block"><h2>Aç mı, Tok mu?</h2><p style="font-size:15.5px;">' + s.timing + '</p></section>' +
    '<section class="block"><h2>Bilimsel Kaynaklar</h2><ol class="srcs">' + srcs + '</ol></section>' +
    '<p class="fine">Bu bilgiler tıbbi tavsiye niteliğinde değildir. İlaç kullanıyorsanız doktorunuza danışınız.</p>';
}

function checkInteractions() {
  var activeSupps = mine.map(function(m) { return m.id; });
  var activeDrugs = myDrugs.map(function(d) { return d.id; });
  var allActive = activeSupps.concat(activeDrugs);
  var foundAlerts = [];

  INTERACTIONS.forEach(function(item) {
    if ((activeSupps.includes(item.a) && (activeDrugs.includes(item.b) || activeSupps.includes(item.b))) ||
        (activeDrugs.includes(item.a) && (activeSupps.includes(item.b) || activeDrugs.includes(item.b)))) {
      foundAlerts.push(item);
    }
  });
  return foundAlerts;
}

function viewMine() {
  var alerts = checkInteractions();
  var alertHtml = "";
  if (alerts.length > 0) {
    alertHtml = alerts.map(function(al) {
      return '<div class="alert-banner"><span>' + al.msg + '</span></div>';
    }).join("");
  }

  var suppItems = mine.map(function (m) {
    var s = SUPPS[m.id];
    if (!s) return "";
    return '<div class="item">' +
      '<div class="item-top"><div><h3>' + s.name + '</h3><div class="fine">Takviye · Hatırlatıcı: ' + m.time + '</div></div>' +
      '<button class="btn ghost small" data-a="remove-supp" data-id="' + m.id + '">Çıkar</button></div>' +
      '<div class="item-top" style="align-items:center;">' +
      '<label class="check-row"><input type="checkbox" data-a="toggle-done-supp" data-id="' + m.id + '" ' + (m.done ? "checked" : "") + '> Bugün Aldım</label>' +
      '<input type="time" value="' + m.time + '" data-time-supp="' + m.id + '">' +
      '</div></div>';
  }).join("");

  var drugItems = myDrugs.map(function (d) {
    var dr = DRUGS[d.id];
    if (!dr) return "";
    return '<div class="item" style="border-left: 4px solid var(--accent);">' +
      '<div class="item-top"><div><h3>' + dr.name + '</h3><div class="fine">' + dr.group + ' · Saat: ' + d.time + '</div></div>' +
      '<button class="btn ghost small" data-a="remove-drug" data-id="' + d.id + '">Çıkar</button></div>' +
      '<div class="item-top" style="align-items:center;">' +
      '<label class="check-row"><input type="checkbox" data-a="toggle-done-drug" data-id="' + d.id + '" ' + (d.done ? "checked" : "") + '> Bugün Aldım</label>' +
      '<input type="time" value="' + d.time + '" data-time-drug="' + d.id + '">' +
      '</div></div>';
  }).join("");

  var totalCount = mine.length + myDrugs.length;

  return alertHtml +
    '<div style="display:flex; justify-content:space-between; align-items:center;">' +
    '<p class="sub">Kullandığınız takviye ve reçeteli ilaçlar:</p>' +
    '<button class="btn small" data-a="open-drug-sheet">+ İlaç Ekle</button></div>' +
    (totalCount === 0 ? '<div class="empty" style="text-align:center; padding: 40px 10px; color: var(--muted);"><h3>Henüz eklenmiş takviye veya ilaç yok</h3><p>Keşfet kısmından takviye ekleyebilir veya yukarıdan kullandığınız ilaçları profilinize ekleyebilirsiniz.</p></div>' : '<div class="list">' + suppItems + drugItems + '</div>');
}

function renderBar() {
  if (state.view === "detail" && state.tab === "discover") {
    var m = findMine(state.supp);
    $bar.innerHTML = '<button class="btn full" data-a="start" data-id="' + state.supp + '">' +
      (m ? "Listenizde Ekli (Saati Değiştir)" : "Kullanmaya Başla (Listeme Ekle)") + '</button>';
    return;
  }
  var totalBadge = mine.length + myDrugs.length;
  $bar.innerHTML =
    '<button class="tab" data-a="tab" data-id="discover"' + (state.tab === "discover" ? ' aria-current="page"' : "") + '>' + ICON.search + 'Keşfet</button>' +
    '<button class="tab" data-a="tab" data-id="mine"' + (state.tab === "mine" ? ' aria-current="page"' : "") + '>' + ICON.pill + 'Kullandıklarım' + (totalBadge ? '<span class="badge">' + totalBadge + '</span>' : "") + '</button>';
}

function render(scroll) {
  renderTop();
  $app.innerHTML = state.tab === "mine" ? viewMine() : state.view === "home" ? viewHome() : viewDetail();
  renderBar();
  if (scroll) window.scrollTo(0, 0);

  var inp = document.getElementById("search-input");
  if (inp) {
    inp.addEventListener("input", function (e) {
      state.search = e.target.value;
      $app.innerHTML = viewHome();
    });
  }
}

function toast(msg) {
  $toast.textContent = msg; $toast.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(function () { $toast.hidden = true; }, 2800);
}

function openSheet(id) {
  var s = SUPPS[id], m = findMine(id);
  $sheet.dataset.id = id;
  $sheet.innerHTML = '<div class="sheet-in"><h2 style="font-size:20px; font-weight:800;">Hatırlatma Saati Kur</h2>' +
    '<p style="font-size:15px; color:var(--muted);">' + s.name + ' için günlük bildirim saatini seçin.</p>' +
    '<div style="display:flex; justify-content:space-between; align-items:center;">' +
    '<label style="font-weight:600;">Saat</label><input type="time" id="sheet-time" value="' + (m ? m.time : "09:00") + '"></div>' +
    '<button class="btn full" data-a="save-supp">' + (m ? "Saati Güncelle" : "Listeme Ekle") + '</button>' +
    '<button class="btn ghost full" data-a="close">Vazgeç</button></div>';
  $sheet.hidden = false;
}

function openDrugSheet() {
  var keys = Object.keys(DRUGS);
  var drugListHtml = keys.map(function(k) {
    var d = DRUGS[k];
    return '<button class="card" data-a="add-drug-item" data-id="' + k + '" style="padding:10px 14px; margin-bottom:6px;">' +
      '<div><h3 style="font-size:16px;">' + d.name + '</h3><p style="font-size:13px;">' + d.desc + '</p></div>' +
      '<span class="btn small" style="pointer-events:none;">Ekle</span></button>';
  }).join("");

  $sheet.innerHTML = '<div class="sheet-in"><h2 style="font-size:20px; font-weight:800;">İlaç Ekle</h2>' +
    '<p style="font-size:14px; color:var(--muted);">Kullandığınız ilacı seçerek profilinize ekleyin ve etkileşimleri otomatik denetleyin:</p>' +
    '<div style="max-height:300px; overflow-y:auto; display:flex; flex-direction:column; gap:6px;">' + drugListHtml + '</div>' +
    '<button class="btn ghost full" data-a="close" style="margin-top:10px;">Kapat</button></div>';
  $sheet.hidden = false;
}

function openDrugTimeSheet(drugId) {
  $sheet.dataset.drugid = drugId;
  $sheet.innerHTML = '<div class="sheet-in"><h2 style="font-size:20px; font-weight:800;">İlaç Alarm Saati</h2>' +
    '<p style="font-size:15px; color:var(--muted);">' + DRUGS[drugId].name + ' için alarm saati seçin:</p>' +
    '<div style="display:flex; justify-content:space-between; align-items:center;">' +
    '<label style="font-weight:600;">Saat</label><input type="time" id="drug-sheet-time" value="08:00"></div>' +
    '<button class="btn full" data-a="save-drug">İlacı Kaydet</button>' +
    '<button class="btn ghost full" data-a="close">Vazgeç</button></div>';
  $sheet.hidden = false;
}

function closeSheet() { $sheet.hidden = true; }

document.addEventListener("click", function (e) {
  if (e.target === $sheet) { closeSheet(); return; }
  var el = e.target.closest("[data-a]"); if (!el) return;
  var a = el.dataset.a, id = el.dataset.id;

  if (a === "supp") { state.supp = id; state.view = "detail"; render(true); }
  else if (a === "back") { state.view = "home"; render(true); }
  else if (a === "tab") { state.tab = id; if(id==='discover') state.view='home'; render(true); }
  else if (a === "start") { openSheet(id); }
  else if (a === "open-drug-sheet") { openDrugSheet(); }
  else if (a === "add-drug-item") { openDrugTimeSheet(id); }
  else if (a === "close") { closeSheet(); }
  else if (a === "save-supp") {
    var v = document.getElementById("sheet-time").value, sid = $sheet.dataset.id;
    if (!v) return;
    var m = findMine(sid);
    if (m) m.time = v; else mine.push({ id: sid, time: v, done: false });
    saveMine(); closeSheet(); render(false);
    toast("Takviye listenize eklendi ve etkileşimler tarandı.");
  }
  else if (a === "save-drug") {
    var v2 = document.getElementById("drug-sheet-time").value, did = $sheet.dataset.drugid;
    if (!v2) return;
    var drObj = findDrug(did);
    if (drObj) drObj.time = v2; else myDrugs.push({ id: did, time: v2, done: false });
    saveDrugs(); closeSheet(); render(false);
    toast("İlaç profilinize eklendi. Etkileşimler kontrol ediliyor.");
  }
  else if (a === "remove-supp") {
    mine = mine.filter(function (x) { return x.id !== id; });
    saveMine(); render(false); toast("Takviye çıkarıldı.");
  }
  else if (a === "remove-drug") {
    myDrugs = myDrugs.filter(function (x) { return x.id !== id; });
    saveDrugs(); render(false); toast("İlaç çıkarıldı.");
  }
  else if (a === "toggle-done-supp") {
    var m2 = findMine(id); if (m2) { m2.done = e.target.checked; saveMine(); }
  }
  else if (a === "toggle-done-drug") {
    var d2 = findDrug(id); if (d2) { d2.done = e.target.checked; saveDrugs(); }
  }
});

document.addEventListener("change", function (e) {
  var suppId = e.target && e.target.dataset && e.target.dataset.timeSupp;
  if (suppId) {
    var m = findMine(suppId); if (m) { m.time = e.target.value; saveMine(); toast("Saat güncellendi."); }
    return;
  }
  var drugId = e.target && e.target.dataset && e.target.dataset.timeDrug;
  if (drugId) {
    var d = findDrug(drugId); if (d) { d.time = e.target.value; saveDrugs(); toast("İlaç saati güncellendi."); }
    return;
  }
});

render(false);
</script>
</body>
</html>
