<style>
html { -webkit-text-size-adjust: 100%; color-scheme: light dark; }
body { margin: 0; }
[hidden] { display: none !important; }

:root {
  --bg: #F1F5F5;
  --surface: #FFFFFF;
  --surface-2: #E8EFEF;
  --ink: #0F2A2E;
  --muted: #4F6468;
  --line: #D3DFE0;
  --accent: #0B6B6F;
  --accent-ink: #FFFFFF;
  --accent-soft: #D7ECEC;
  --warn-bg: #FFF1DC;
  --warn-ink: #6E3800;
  --warn-line: #E6B56B;
  --danger-bg: #FEE2E2;
  --danger-ink: #991B1B;
  --danger-line: #F87171;
  --font-display: "Plus Jakarta Sans", system-ui, sans-serif;
  --font-body: "Source Sans 3", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", monospace;
}

/* KOZMETİK TEMASI (PEMBE MOD) */
body[data-mode="cosmetics"] {
  --bg: #FAF4F6;
  --surface: #FFFFFF;
  --surface-2: #F6E6EC;
  --ink: #2C1820;
  --muted: #7A5C68;
  --line: #E8CFD8;
  --accent: #D85A8A;
  --accent-ink: #FFFFFF;
  --accent-soft: #FADCE6;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1719; --surface: #132226; --surface-2: #1A2D31; --ink: #E4F0F0; --muted: #93AAAD;
    --line: #243A3E; --accent: #5FC4C4; --accent-ink: #072022; --accent-soft: #17383B;
    --warn-bg: #2B2012; --warn-ink: #F2C98A; --warn-line: #5C4520;
    --danger-bg: #3B1212; --danger-ink: #FCA5A5; --danger-line: #7F1D1D;
  }
  body[data-mode="cosmetics"]:not([data-theme="light"]) {
    --bg: #1B1015; --surface: #26171E; --surface-2: #331F28; --ink: #F5E6EC; --muted: #B38F9D;
    --line: #422834; --accent: #E875A0; --accent-ink: #1B0B12; --accent-soft: #3D1E2A;
  }
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-block: 0 100px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  transition: background-color 0.2s ease;
}
.wrap { max-width: 500px; margin: 0 auto; min-width: 0; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; letter-spacing: -0.01em; }
p, ul { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }

.top {
  position: sticky; top: 0; z-index: 10;
  background: var(--bg); display: flex; flex-direction: column; gap: 10px;
  padding-block: 12px 10px; border-bottom: 1px solid var(--line);
}
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 20px; }
.brand span { color: var(--accent); }
.back {
  width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); display: grid; place-items: center; flex: none;
}
.top-title { font-family: var(--font-display); font-weight: 700; font-size: 18px; flex: 1; }

.search-box { position: relative; width: 100%; display: flex; align-items: center; }
.search-box input {
  width: 100%; font-family: var(--font-body); font-size: 15px; padding: 10px 14px 10px 38px;
  border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); outline: none;
}
.search-box input:focus { border-color: var(--accent); }
.search-icon { position: absolute; left: 12px; color: var(--muted); pointer-events: none; display: flex; }

.screen { display: flex; flex-direction: column; gap: 16px; padding-block: 12px; }

.list { display: flex; flex-direction: column; gap: 10px; }
.card {
  width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface);
  border-radius: 16px; padding: 14px 16px; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center;
}
.card h3 { font-size: 17px; color: var(--ink); }
.card p { color: var(--muted); font-size: 13.5px; grid-column: 1; line-height: 1.35; }
.card .go { grid-row: 1 / span 3; grid-column: 2; color: var(--muted); }
.ev { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); font-weight: 500; }
.meter { display: inline-flex; gap: 3px; }
.meter i { width: 12px; height: 5px; border-radius: 3px; background: var(--line); display: block; }
.meter i.on { background: var(--accent); }

.hero { display: flex; flex-direction: column; gap: 4px; }
.hero h1 { font-size: 24px; font-weight: 800; }
.alt { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.block { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.block.warn { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn-ink); }
.block.good { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.block h2 { font-size: 16px; font-weight: 700; }
.block ul { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.block li { padding-left: 14px; position: relative; font-size: 14.5px; }
.block li::before { content: ""; position: absolute; left: 0; top: 0.6em; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }

.dose { display: flex; align-items: baseline; gap: 8px; }
.dose .big { font-family: var(--font-mono); font-weight: 700; font-size: 24px; color: var(--accent); }
.dose .per { color: var(--muted); font-size: 13.5px; }

.btn {
  border: 0; border-radius: 12px; min-height: 44px; padding: 0 16px; font-weight: 700; font-size: 15px;
  background: var(--accent); color: var(--accent-ink); font-family: var(--font-display); display: inline-flex; align-items: center; justify-content: center;
}
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.small { min-height: 34px; font-size: 13px; padding: 0 10px; border-radius: 8px; }
.btn.full { width: 100%; }

#bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface);
  border-top: 1px solid var(--line);
  padding: 8px max(16px, env(safe-area-inset-left, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px));
}
#bar .in { max-width: 500px; margin: 0 auto; display: flex; gap: 8px; }
.tab {
  flex: 1; border: 0; background: transparent; border-radius: 10px; min-height: 48px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 600; color: var(--muted);
}
.tab[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
.badge { background: var(--accent); color: var(--accent-ink); font-size: 11px; border-radius: 999px; padding: 1px 6px; margin-left: 4px; font-family: var(--font-mono); }

#sheet { position: fixed; inset: 0; z-index: 40; background: rgba(6, 18, 20, 0.55); display: flex; align-items: flex-end; justify-content: center; }
#sheet[hidden] { display: none !important; }
.sheet-in {
  width: 100%; max-width: 500px; background: var(--surface); border-radius: 20px 20px 0 0; border: 1px solid var(--line);
  padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; max-height: 80vh; overflow-y: auto;
}

#modal-overlay {
  position: fixed; inset: 0; z-index: 100; background: rgba(0, 0, 0, 0.65);
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
#modal-overlay[hidden] { display: none !important; }
.modal-box {
  width: 100%; max-width: 400px; background: var(--surface); border-radius: 20px; border: 1px solid var(--line);
  padding: 24px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

.notif-badge-btn {
  position: relative; width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); display: grid; place-items: center; color: var(--accent); cursor: pointer; flex: none;
}
.notif-dot {
  position: absolute; top: -3px; right: -3px; width: 10px; height: 10px; background: var(--danger-ink); border-radius: 50%; border: 2px solid var(--surface);
}

/* PEMBE "K" HARFİ IKONU */
.cosmo-k-btn {
  width: 38px; height: 38px; border-radius: 10px; border: 1px solid #F3C2D4;
  background: #FDF0F5; color: #D85A8A; display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 800; font-size: 17px; cursor: pointer; flex: none;
  box-shadow: 0 2px 6px rgba(216, 90, 138, 0.15); transition: all 0.2s ease;
}
.cosmo-k-btn.active {
  background: #D85A8A; color: #FFFFFF; border-color: #D85A8A;
}

#toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 50;
  background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 10px; font-weight: 600; font-size: 13.5px;
  max-width: calc(100vw - 32px); text-align: center;
}
#toast[hidden] { display: none !important; }
.fine { font-size: 13px; color: var(--muted); }

/* PROFİL VE KART STİLLERİ */
.profile-avatar-container { position: relative; width: 96px; height: 96px; margin: 0 auto 8px auto; }
.profile-avatar {
  width: 100%; height: 100%; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
  display: grid; place-items: center; font-size: 36px; font-weight: 800; border: 3px solid var(--accent);
  overflow: hidden; object-fit: cover;
}
.p-hero { background: linear-gradient(145deg, var(--accent) 0%, #0B6B6F 100%); border-radius: 24px; padding: 18px 16px 16px; color: #fff; display: flex; flex-direction: column; gap: 14px; }
body[data-mode="cosmetics"] .p-hero { background: linear-gradient(145deg, #D85A8A 0%, #A83864 100%); }
.p-top { display: flex; align-items: center; gap: 14px; }
.p-top .profile-avatar-container { margin: 0; width: 68px; height: 68px; flex: none; }
.p-top .profile-avatar { font-size: 26px; border: 2px solid rgba(255, 255, 255, 0.85); background: rgba(255, 255, 255, 0.18); color: #fff; }
.p-id { flex: 1; min-width: 0; }
.p-id h2 { font-size: 19px; font-weight: 800; color: #fff; }
.p-id div { font-size: 12.5px; opacity: 0.85; }

.lg-card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: transparent; border-radius: 11px; min-height: 40px; font-weight: 700; font-size: 14.5px; color: var(--muted); }
.seg button.active { background: var(--surface); color: var(--accent); }
.lg-brand { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.lg-brand h1 { font-size: 23px; font-weight: 800; }
.lg-brand h1 span { color: var(--accent); }
</style>
</head>

    summary: "Hücresel yenilenme, kırışıklık karşıtı ve anti-aging bakım.",
    ev: 4, evLabel: "Çok Güçlü",
    who: ["İnce çizgi ve yaşlanma belirtisi görenler"],
    care: ["Gebelikte kullanılmaz. Sadece gece uygulanır, gündüz güneş kremi şarttır."],
    does: ["Kollajen üretimini tetikler.", "Hücre dönüşüm hızını artırır."],
    dose: { big: "%0.1 - %0.5", per: "gece" }
  },
  vitamin_c: {

    summary: "Güçlü antioksidan, ışıltı verici ve güneş lekesi karşıtı.",

    care: ["Oksitlenmeye karşı karanlıkta saklanmalıdır."],
    does: ["Serbest radikallerle savaşır.", "Cilde parlaklık kazandırır."],
    dose: { big: "%10 - %15", per: "sabah" }
  },
  glycolic: {
    name: "Glikolik Asit (AHA)", alt: "Alpha Hydroxy Acid",
    summary: "Cilt yüzeyi soyma, leke açma ve pürüzsüz doku sağlama.",
    ev: 3, evLabel: "Orta-Güçlü",
    who: ["Cilt yüzeyinde pürüz ve leke olanlar"],
    care: ["Hassas ciltleri irite edebilir."],

  ceramides: {

    summary: "Cilt bariyeri onarımı, nem kaybını önleme ve yatıştırma.",

    who: ["Bariyeri bozulmuş, kızarık ve hassas ciltler"],
    care: ["Tüm cilt tipleri için güvenlidir."],
    does: ["Hücreler arası yapıştırıcı harç görevini görerek bariyeri onarır."],
    dose: { big: "Krem Formu", per: "günde 2 kez" }

var SUPPS = Object.assign({}, DEFAULT_SUPPS);
var currentUser = null;
var userProfile = { username: "", photoUrl: "" };

// MOD KONTROLÜ: 'supplements' veya 'cosmetics'
var appModule = "supplements"; 
var state = { view: "login", authMode: "login", tab: "discover", supp: null, search: "", editId: null };
var mine = [];
var myCosmetics = [];

if (typeof auth !== "undefined") {
  auth.onAuthStateChanged(function(user) {
    currentUser = user;
    if (user) {
      if (!user.emailVerified) {
        state.view = "verify_notice";
        document.getElementById("bar").hidden = true;
        render();
        return;
      }
      state.view = "home";
      document.getElementById("bar").hidden = false;
      loadUserData();
      loadUserProfile();
    } else {
      state.view = "login";
      document.getElementById("bar").hidden = true;
      render();
    }
  });
}

function loadUserProfile() {
  if (!currentUser || typeof db === "undefined") return;
  db.collection("users").doc(currentUser.uid).get().then(function(doc) {
    if (doc.exists) { userProfile = doc.data(); }
    render(false);
  });
}

function loadUserData() {
  if(!currentUser) return;
  try {
    mine = JSON.parse(localStorage.getItem("tk_mine_" + currentUser.uid) || "[]");
    myCosmetics = JSON.parse(localStorage.getItem("tk_cosmo_" + currentUser.uid) || "[]");
  } catch(e) { mine = []; myCosmetics = []; }
  render();
}

function saveUserData() {
  if(!currentUser) return;
  try {
    localStorage.setItem("tk_mine_" + currentUser.uid, JSON.stringify(mine));
    localStorage.setItem("tk_cosmo_" + currentUser.uid, JSON.stringify(myCosmetics));
  } catch(e) {}
}

var ICON = {
  back: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 5l-7 7 7 7"/></svg>',
  go: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 5l7 7-7 7"/></svg>',
  search: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  pill: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="8.5" width="18" height="7" rx="3.5" transform="rotate(-35 12 12)"/></svg>',
  bell: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>',
  user: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>'
};

function meter(n) {
  return '<span class="meter">' + [1, 2, 3, 4].map(function (i) { return '<i class="' + (i <= n ? "on" : "") + '"></i>'; }).join("") + "</span>";
}

function renderTop() {
  var $top = document.getElementById("top");
  if (state.view === "login" || state.view === "verify_notice") { $top.innerHTML = ''; return; }
  
  var notifBtn = '<button class="notif-badge-btn" data-a="open-announcements-modal">' + ICON.bell + '</button>';
  var kBtn = '<button class="cosmo-k-btn ' + (appModule === 'cosmetics' ? 'active' : '') + '" data-a="toggle-module" title="Kozmetik Rehberim">K</button>';

  var titleHtml = (appModule === "cosmetics") ? 'Kozmetik<span>Rehberi</span>' : 'Takviye<span>Rehberi</span>';

  if (state.tab === "routine") {
    var rTitle = (appModule === "cosmetics") ? 'Cilt Bakım <span>Rutinim</span>' : 'Takviye <span>Rutinim</span>';
    $top.innerHTML = '<div class="top-row"><h1 class="brand">' + rTitle + '</h1><div style="display:flex; gap:6px;">' + kBtn + notifBtn + '</div></div>';
    return;
  }
  if (state.tab === "profile") {
    $top.innerHTML = '<div class="top-row"><h1 class="brand">Profil<span>im</span></h1><div style="display:flex; gap:6px;">' + kBtn + notifBtn + '</div></div>';
    return;
  }
  if (state.view === "home") {
    $top.innerHTML = '<div class="top-row"><div class="brand">' + titleHtml + '</div><div style="display:flex; gap:6px; align-items:center;">' + kBtn + notifBtn + '</div></div>' +
      '<div class="search-box"><span class="search-icon">' + ICON.search + '</span>' +
      '<input type="text" id="search-input" placeholder="' + (appModule === 'cosmetics' ? 'Etken madde veya içerik ara...' : '120+ Takviye ve içerik ara...') + '" value="' + esc(state.search) + '"></div>';
    return;
  }
  var dataSet = (appModule === "cosmetics") ? COSMETICS_DATA : SUPPS;
  var title = dataSet[state.supp] ? esc(dataSet[state.supp].name) : "";
  $top.innerHTML = '<div class="top-row"><button class="back" data-a="back">' + ICON.back + '</button><div class="top-title">' + title + '</div>' + kBtn + '</div>';
}

function viewHome() {
  var dataSet = (appModule === "cosmetics") ? COSMETICS_DATA : SUPPS;
  var keys = Object.keys(dataSet);
  if (state.search.trim() !== "") {
    var q = state.search.toLowerCase();
    keys = keys.filter(function (k) {
      var s = dataSet[k];
      return s.name.toLowerCase().indexOf(q) !== -1 || (s.summary && s.summary.toLowerCase().indexOf(q) !== -1);
    });
  }
  var items = keys.map(function (id) {
    var s = dataSet[id];
    return '<button class="card" data-a="supp" data-id="' + esc(id) + '">' +
      '<div><h3>' + esc(s.name) + '</h3><p>' + esc(s.summary) + '</p><span class="ev">' + meter(s.ev || 3) + esc(s.evLabel || "Güçlü") + '</span></div>' +
      '<span class="go">' + ICON.go + '</span></button>';
  }).join("");

  return '<div class="list">' + items + '</div>';
}

function viewDetail() {
  var dataSet = (appModule === "cosmetics") ? COSMETICS_DATA : SUPPS;
  var s = dataSet[state.supp]; if (!s) return "";
  var li = function (arr) { return (arr || []).map(function (t) { return '<li>' + esc(t) + '</li>'; }).join(""); };

  return '<div class="hero"><h1>' + esc(s.name) + '</h1><div class="alt">' + esc(s.alt || "") + '</div><span class="ev">' + meter(s.ev || 3) + esc(s.evLabel || "") + '</span></div>' +
    '<section class="block good"><h2>Kullanım Amacı ve Kimler İçin?</h2><ul>' + li(s.who) + '</ul></section>' +
    '<section class="block warn"><h2>Dikkat Edilmesi Gerekenler</h2><ul>' + li(s.care) + '</ul></section>' +
    '<section class="block"><h2>Öne Çıkan Faydaları</h2><ul>' + li(s.does) + '</ul></section>' +
    '<section class="block"><h2>Önerilen Kullanım Şekli</h2><div class="dose"><span class="big">' + esc(s.dose ? s.dose.big : "1 Uygulama") + '</span><span class="per">' + esc(s.dose ? s.dose.per : "") + '</span></div></section>';
}

function viewRoutinePage() {
  var activeList = (appModule === "cosmetics") ? myCosmetics : mine;
  var dataSet = (appModule === "cosmetics") ? COSMETICS_DATA : SUPPS;

  var itemsHtml = activeList.length ? activeList.map(function(item) {
    var info = dataSet[item.id] || { name: item.id, summary: "" };
    return '<div class="card">' +
      '<div><h3>' + esc(info.name) + '</h3><p>' + esc(info.summary) + '</p></div>' +
      '<button class="btn small ghost" data-a="remove-routine-item" data-id="' + item.id + '">Çıkar</button>' +
      '</div>';
  }).join("") : '<div class="block" style="text-align:center;"><p class="fine">Henüz rutininize bir öğe eklemediniz.</p></div>';

  return '<section class="p-hero"><div class="p-top"><div class="p-id"><h2>' + 
    (appModule === 'cosmetics' ? 'Cilt Bakım Rutinim' : 'Takviye Rutinim') + 
    '</h2><div>Eklenti ve takip listeniz</div></div></div></section>' +
    '<div class="list">' + itemsHtml + '</div>';
}

function viewProfile() {
  var email = currentUser ? (currentUser.email || "") : "";
  var name = userProfile.username || "Kullanıcı";
  var photoSrc = userProfile.photoUrl || "";

  return '<section class="p-hero">' +
    '<div class="p-top">' +
      '<div class="profile-avatar-container">' +
        (photoSrc ? '<img src="' + photoSrc + '" class="profile-avatar">' : '<div class="profile-avatar">' + esc(name.charAt(0).toUpperCase()) + '</div>') +
      '</div>' +
      '<div class="p-id"><h2>' + esc(userProfile.fullName || name) + '</h2><div>' + esc(email) + '</div></div>' +
    '</div>' +
  '</section>' +
  '<section class="block"><h2>Kişisel Sağlık Bilgileri</h2>' +
    '<p class="fine">Bu bilgiler hem Takviye hem Kozmetik rehberiniz için ortaktır.</p>' +
    '<div style="font-size:14px; display:flex; flex-direction:column; gap:6px;">' +
      '<div><b>Cinsiyet:</b> ' + (userProfile.health && userProfile.health.gender === 'f' ? 'Kadın' : 'Erkek') + '</div>' +
      '<div><b>Boy:</b> ' + (userProfile.health && userProfile.health.height ? userProfile.health.height + ' cm' : '—') + '</div>' +
    '</div>' +
  '</section>' +
  '<section class="block"><button class="btn ghost full" data-a="logout">Oturumu Kapat</button></section>';
}

function renderInner(scroll) {
  document.body.setAttribute("data-mode", appModule);

  var $app = document.getElementById("app");
  if (state.view === "login") { 
    document.getElementById("top").innerHTML = ''; 
    $app.innerHTML = '<div class="lg-card lg-brand"><h1>Takviye & Kozmetik <span>Rehberi</span></h1><p>Giriş yapın ve rehberinize erişin.</p><input type="email" id="log-email" placeholder="E-posta" style="width:100%; padding:10px; border-radius:10px; border:1px solid var(--line);"><input type="password" id="log-pass" placeholder="Şifre" style="width:100%; padding:10px; border-radius:10px; border:1px solid var(--line); margin-top:8px;"><button class="btn full" data-a="do-login" style="margin-top:10px;">Giriş Yap</button></div>';
    document.getElementById("bar").hidden = true; 
    return; 
  }
  
  renderTop();
  
  if (state.tab === "profile") { $app.innerHTML = viewProfile(); }
  else if (state.tab === "routine") { $app.innerHTML = viewRoutinePage(); }
  else { $app.innerHTML = (state.view === "home") ? viewHome() : viewDetail(); }

  renderBar();
  if (scroll) window.scrollTo(0, 0);

  var inp = document.getElementById("search-input");
  if (inp) {
    inp.addEventListener("input", function (e) {
      state.search = e.target.value;
      $app.innerHTML = viewHome();
    });
  }
}

function renderBar() {
  if (state.view === "login") return;
  var $bar = document.getElementById("barin");
  if (state.view === "detail" && state.tab === "discover") {
    var activeList = (appModule === "cosmetics") ? myCosmetics : mine;
    var exists = activeList.some(function(x){ return x.id === state.supp; });
    $bar.innerHTML = '<button class="btn full" data-a="toggle-add-routine" data-id="' + esc(state.supp) + '">' +
      (exists ? "Rutinimden Çıkar" : "Rutinite Ekle") + '</button>';
    return;
  }
  $bar.innerHTML =
    '<button class="tab" data-a="tab" data-id="discover"' + (state.tab === "discover" ? ' aria-current="page"' : "") + '>' + ICON.search + 'Keşfet</button>' +
    '<button class="tab" data-a="tab" data-id="routine"' + (state.tab === "routine" ? ' aria-current="page"' : "") + '>' + ICON.pill + 'Rutinim</button>' +
    '<button class="tab" data-a="tab" data-id="profile"' + (state.tab === "profile" ? ' aria-current="page"' : "") + '>' + ICON.user + 'Profilim</button>';
}

function render(scroll) { renderInner(scroll); }

document.addEventListener("click", function (e) {
  var el = e.target.closest("[data-a]"); if (!el) return;
  var a = el.dataset.a, id = el.dataset.id;

  if (a === "toggle-module") {
    appModule = (appModule === "supplements") ? "cosmetics" : "supplements";
    state.view = "home";
    state.supp = null;
    render(true);
  }
  else if (a === "supp") { state.supp = id; state.view = "detail"; render(true); }
  else if (a === "back") { state.view = "home"; render(true); }
  else if (a === "tab") { state.tab = id; if(id === 'discover') state.view = 'home'; render(true); }
  else if (a === "do-login") {
    var email = document.getElementById("log-email").value;
    var pass = document.getElementById("log-pass").value;
    auth.signInWithEmailAndPassword(email, pass);
  }
  else if (a === "logout") { auth.signOut(); }
  else if (a === "toggle-add-routine") {
    var activeList = (appModule === "cosmetics") ? myCosmetics : mine;
    var idx = activeList.findIndex(function(x){ return x.id === id; });
    if (idx > -1) { activeList.splice(idx, 1); } 
    else { activeList.push({ id: id }); }
    saveUserData();
    renderBar();
  }
  else if (a === "remove-routine-item") {
    var activeList = (appModule === "cosmetics") ? myCosmetics : mine;
    var idx = activeList.findIndex(function(x){ return x.id === id; });
    if (idx > -1) { activeList.splice(idx, 1); saveUserData(); render(false); }
  }
});

render(false);
</script>
</body>
</html>
