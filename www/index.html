document.addEventListener("click", function (e) {
  if (e.target === $sheet) { closeSheet(); return; }
  if (e.target === $modal) { closeModal(); return; }
  var el = e.target.closest("[data-a]"); if (!el) return;
  var a = el.dataset.a, id = el.dataset.id;

  if (a === "close-modal") { closeModal(); }
  else if (a === "open-announcements-modal") { openAnnouncementsModal(); }
  else if (a === "switch-auth") { state.authMode = el.dataset.mode; render(false); }
  else if (a === "toggle-pass") {
    var pin = el.parentNode.querySelector("input");
    if (pin) { pin.type = pin.type === "password" ? "text" : "password"; }
  }
  else if (a === "forgot-pass") {
    var fe = document.getElementById("log-email").value.trim();
    var ferr = document.getElementById("log-err");
    if (!fe) { ferr.textContent = "Önce e-posta adresini yaz."; return; }
    auth.sendPasswordResetEmail(fe).then(function () {
      ferr.textContent = "";
      toast("Bu e-posta kayıtlıysa sıfırlama bağlantısı gönderildi.");
    }).catch(function () { ferr.textContent = "Geçerli bir e-posta adresi yaz."; });
  }
  else if (a === "do-login" || a === "do-register") {
    var emailInput = document.getElementById("log-email").value.trim();
    var pass = document.getElementById("log-pass").value;

    if(!emailInput || !pass) { document.getElementById("log-err").textContent = "Lütfen alanları doldurunuz."; return; }
    
    var errBox = document.getElementById("log-err");
    var trErr = function (err) {
      var c = err && err.code || "";
      if (c === "auth/invalid-credential" || c === "auth/wrong-password" || c === "auth/user-not-found" || c === "auth/invalid-login-credentials") return "E-posta veya şifre hatalı.";
      if (c === "auth/email-already-in-use") return "Bu e-posta ile zaten bir hesap var.";
      if (c === "auth/weak-password") return "Şifre en az 6 karakter olmalı.";
      if (c === "auth/invalid-email") return "Geçerli bir e-posta giriniz.";
      if (c === "auth/too-many-requests") return "Çok fazla deneme yapıldı, biraz sonra tekrar deneyin.";
      if (c === "auth/network-request-failed") return "İnternet bağlantısı yok.";
      return "İşlem başarısız. Lütfen tekrar deneyin.";
    };

    if (a === "do-register") {
      var usernameInput = document.getElementById("log-username").value.trim().toLowerCase();
      var pass2 = document.getElementById("log-pass2").value;
      var legalChecked = document.getElementById("legal-check").checked;

      if (!/^[a-z0-9_]{3,20}$/.test(usernameInput)) { errBox.textContent = "Kullanıcı adı 3-20 karakter olmalı (harf, rakam, alt çizgi)."; return; }
      if (pass.length < 8) { errBox.textContent = "Şifre en az 8 karakter olmalı."; return; }
      if (pass !== pass2) { errBox.textContent = "Şifreler birbiriyle eşleşmiyor."; return; }
      if (!legalChecked) { errBox.textContent = "Lütfen yasal bilgilendirmeyi onaylayınız."; return; }

      // Kullanıcı adı rezervasyonu: usernames/{ad} belgesi sadece uid tutar, e-posta tutmaz.
      db.collection("usernames").doc(usernameInput).get().then(function (d) {
        if (d.exists) { errBox.textContent = "Bu kullanıcı adı zaten alınmış."; return; }
        return auth.createUserWithEmailAndPassword(emailInput, pass).then(function (cred) {
          var uid = cred.user.uid;
          var batch = db.batch();
          batch.set(db.collection("usernames").doc(usernameInput), { uid: uid });
          batch.set(db.collection("users").doc(uid), { username: usernameInput, photoUrl: "" });
          return batch.commit().then(function () {
            return cred.user.sendEmailVerification();
          }).then(function () { toast("Doğrulama maili gönderildi!"); });
        });
      }).catch(function (err) { errBox.textContent = trErr(err); });

    } else {
      auth.signInWithEmailAndPassword(emailInput, pass).catch(function (err) { errBox.textContent = trErr(err); });
    }
  }
  else if (a === "save-profile") {
    if (!currentUser) return;
    if (selectedProfileFile === null) { toast("Değişiklik yok."); return; }
    var photo = safeImg(selectedProfileFile);
    if (!photo) { alert("Geçersiz veya çok büyük fotoğraf."); return; }
    toast("Profil güncelleniyor...");
    db.collection("users").doc(currentUser.uid).set({ photoUrl: photo }, { merge: true }).then(function () {
      userProfile.photoUrl = photo;
      selectedProfileFile = null;
      toast("Profiliniz güncellendi!");
      render(false);
    }).catch(function (err) { alert("Güncelleme hatası. Lütfen tekrar deneyin."); console.log(err); });
  }
  else if (a === "open-supp-sheet") { openSuppSheet(); }
  else if (a === "open-sound-sheet") { openSoundSheet(); }
  else if (a === "play-snd") {
    var sSel = document.getElementById("snd-" + el.dataset.kind);
    if (sSel) playSound(sSel.value);
  }
  else if (a === "open-avatar-sheet") { openAvatarSheet(); }
  else if (a === "pick-avatar") {
    closeSheet();
    saveProfileFields({ avatar: id, photoUrl: "" }, function () { userProfile.avatar = id; userProfile.photoUrl = ""; selectedProfileFile = null; });
  }
  else if (a === "remove-photo") {
    closeSheet();
    saveProfileFields({ avatar: "", photoUrl: "" }, function () { userProfile.avatar = ""; userProfile.photoUrl = ""; selectedProfileFile = null; });
  }
  else if (a === "edit-health") { openHealthSheet(); }
  else if (a === "save-health") {
    var gv = document.getElementById("hl-gender").value;
    var by = numOrNull(document.getElementById("hl-by").value, 1900, new Date().getFullYear());
    var ht = numOrNull(document.getElementById("hl-h").value, 80, 250);
    var cw = numOrNull(document.getElementById("hl-w").value, 20, 400);
    var gw = numOrNull(document.getElementById("hl-gw").value, 20, 400);
    var hb = document.getElementById("hl-blood").value;
    var hn = document.getElementById("hl-note").value.trim().slice(0, 200);
    var fn = document.getElementById("hl-name").value.trim().slice(0, 60);
    var hobj = { gender: gv, birthYear: by || "", height: ht || "", goalWeight: gw || "", blood: hb, note: hn };
    var fields = { health: hobj, fullName: fn };
    var newLog = null;
    if (cw && cw !== latestOf("w")) {
      newLog = healthLog().concat([{ d: todayISO(), w: cw }]);
      newLog.sort(function (x, y) { return x.d < y.d ? -1 : (x.d > y.d ? 1 : 0); });
      if (newLog.length > 400) newLog = newLog.slice(-400);
      fields.healthLog = newLog;
    }
    closeSheet();
    saveProfileFields(fields, function () { userProfile.health = hobj; userProfile.fullName = fn; if (newLog) userProfile.healthLog = newLog; toast("Bilgiler kaydedildi."); });
  }
  else if (a === "add-log") { openLogSheet(); }
  else if (a === "save-log") {
    var ld = document.getElementById("lg-date").value || todayISO();
    var lw = numOrNull(document.getElementById("lg-w").value, 20, 400);
    var ls = numOrNull(document.getElementById("lg-s").value, 50, 260);
    var ldi = numOrNull(document.getElementById("lg-di").value, 30, 160);
    var lgl = numOrNull(document.getElementById("lg-g").value, 20, 700);
    if (!lw && !ls && !ldi && !lgl) { toast("En az bir değer gir."); return; }
    if ((ls && !ldi) || (ldi && !ls)) { toast("Tansiyon için iki değeri de gir."); return; }
    var entry = { d: ld };
    if (lw) entry.w = lw;
    if (ls) { entry.s = ls; entry.di = ldi; }
    if (lgl) entry.g = lgl;
    var lg2 = healthLog().concat([entry]);
    lg2.sort(function (x, y) { return x.d < y.d ? -1 : (x.d > y.d ? 1 : 0); });
    if (lg2.length > 400) lg2 = lg2.slice(-400);
    closeSheet();
    saveProfileFields({ healthLog: lg2 }, function () { userProfile.healthLog = lg2; toast("Ölçüm kaydedildi."); });
  }
  else if (a === "del-log") {
    var di2 = parseInt(el.dataset.idx, 10);
    var lg3 = healthLog().slice();
    if (di2 >= 0 && di2 < lg3.length) {
      lg3.splice(di2, 1);
      saveProfileFields({ healthLog: lg3 }, function () { userProfile.healthLog = lg3; toast("Silindi."); });
    }
  }
  else if (a === "test-alarm") { testAlarm(); }
  else if (a === "resend-verify") {
    if (auth && auth.currentUser) {
      auth.currentUser.sendEmailVerification().then(function() { toast("Doğrulama bağlantısı iletildi."); });
    }
  }
  else if (a === "logout") {
    stopCloudSync();
    cancelAllAlarms();
    if (typeof auth !== "undefined") { auth.signOut(); }
    currentUser = null; userProfile = { username: "", photoUrl: "" }; state.view = "login"; document.getElementById("bar").hidden = true; render();
  }
  else if (a === "go-admin") {
    if (!currentUser || currentUser.email !== ADMIN_EMAIL) { toast("Bu alana yalnızca yönetici erişebilir."); return; }
    state.view = "admin"; render(true);
  }
  else if (a === "go-koz") {
    if (!currentUser) { toast("Kozmetik Rehberi için giriş yapmalısınız."); return; }
    // Toggle: kozmetik modda K'ya basınca takviyeye dön
    if (state.appMode === 'koz') {
      state.appMode = 'supp'; state.view = 'home'; state.tab = 'discover'; render(true);
    } else {
      state.appMode = 'koz'; state.kozTab = 'etkenler'; state.view = 'home'; render(true);
    }
  }
  else if (a === "go-supp") {
    state.appMode = 'supp'; state.view = 'home'; state.tab = 'discover'; render(true);
  }
  else if (a === "koz-tab") {
    state.kozTab = id; state.view = 'home'; render(true);
  }
  else if (a === "koz-etken") {
    state.kozEtken = id; state.view = 'koz-detail'; render(true);
  }
  else if (a === "skin-tip") {
    // Cilt tipi seç — tekrar basınca deseç
    var sp = userProfile.skin || {};
    sp.tip = (sp.tip === id) ? "" : id;
    userProfile.skin = sp;
    render(false);
  }
  else if (a === "skin-sorun") {
    // Cilt sorunu toggle (çoklu seçim)
    var sp2 = userProfile.skin || {};
    var sorunlar = sp2.sorunlar ? sp2.sorunlar.slice() : [];
    var idx = sorunlar.indexOf(id);
    if (idx === -1) { sorunlar.push(id); } else { sorunlar.splice(idx, 1); }
    sp2.sorunlar = sorunlar;
    userProfile.skin = sp2;
    render(false);
  }
  else if (a === "skin-aktif") {
    // Kullanılan aktif toggle (çoklu seçim)
    var sp3 = userProfile.skin || {};
    var aktifler = sp3.aktifler ? sp3.aktifler.slice() : [];
    var aidx = aktifler.indexOf(id);
    if (aidx === -1) { aktifler.push(id); } else { aktifler.splice(aidx, 1); }
    sp3.aktifler = aktifler;
    userProfile.skin = sp3;
    render(false);
  }
  else if (a === "add-aktif-to-rutin") {
    var sp4 = userProfile.skin || {};
    var aks = sp4.aktifler ? sp4.aktifler.slice() : [];
    if (aks.indexOf(id) === -1) { aks.push(id); }
    sp4.aktifler = aks;
    userProfile.skin = sp4;
    // Otomatik kaydet
    try { if (currentUser) localStorage.setItem("koz_skin_" + currentUser.uid, JSON.stringify(sp4)); } catch(e2) {}
    if (currentUser && typeof db !== "undefined") {
      db.collection("users").doc(currentUser.uid).set({ skin: sp4 }, { merge: true }).catch(function(){});
    }
    var ekEtken = KOZ_ETKENLER[id];
    toast((ekEtken ? ekEtken.icon + ' ' + ekEtken.name : id) + " rutinine eklendi ✨");
    render(false);
  }
  else if (a === "remove-aktif-from-rutin") {
    var sp5 = userProfile.skin || {};
    var aks2 = sp5.aktifler ? sp5.aktifler.slice() : [];
    var ridx = aks2.indexOf(id);
    if (ridx !== -1) { aks2.splice(ridx, 1); }
    sp5.aktifler = aks2;
    userProfile.skin = sp5;
    try { if (currentUser) localStorage.setItem("koz_skin_" + currentUser.uid, JSON.stringify(sp5)); } catch(e2) {}
    if (currentUser && typeof db !== "undefined") {
      db.collection("users").doc(currentUser.uid).set({ skin: sp5 }, { merge: true }).catch(function(){});
    }
    toast("Rutinden çıkarıldı.");
    render(false);
  }
  else if (a === "save-skin") {
    if (!currentUser) { toast("Giriş yapmalısınız."); return; }
    var skinData = userProfile.skin || {};
    // localStorage yedek — her zaman hemen kaydet
    try { localStorage.setItem("koz_skin_" + currentUser.uid, JSON.stringify(skinData)); } catch(e2) {}
    if (typeof db !== "undefined") {
      db.collection("users").doc(currentUser.uid).set({ skin: skinData }, { merge: true })
        .then(function() { toast("Cilt profilin kaydedildi ✨"); render(false); })
        .catch(function(err) {
          // Firestore başarısız olsa bile localStorage'dan okuyabiliriz
          toast("Yerel olarak kaydedildi (sunucu: " + (err && err.code ? err.code : "hata") + ")");
          render(false);
        });
    } else {
      toast("Cilt profilin kaydedildi ✨ (çevrimdışı)");
      render(false);
    }
  }
  else if (a === "supp") { state.supp = id; state.view = "detail"; render(true); }
  else if (a === "back" || a === "back-to-home") { navBack(); }
  else if (a === "tab") { state.tab = id; if(id==='discover') state.view='home'; render(true); }
  else if (a === "start") { openWizard("supp", id); }
  else if (a === "open-drug-sheet") { openDrugSheet(); }
  else if (a === "add-drug-item") { openWizard("drug", id); }
  else if (a === "close") { closeSheet(); }
  else if (a === "start-edit") {
    if (!currentUser || currentUser.email !== ADMIN_EMAIL) { toast("Yalnızca yönetici düzenleme yapabilir."); return; }
    state.editId = id || state.supp;
    state.editFrom = state.view;
    state.view = "edit_supp";
    render(true);
  }
  else if (a === "add-extra-block") {
    var s = SUPPS[state.editId];
    if (!s.extraBlocks) s.extraBlocks = [];
    s.extraBlocks.push({ title: "Yeni Başlık", theme: "good", items: ["Madde 1", "Madde 2"] });
    render(false);
  }
  else if (a === "remove-extra-block") {
    var idx = parseInt(el.dataset.idx);
    var s = SUPPS[state.editId];
    if (s && s.extraBlocks) {
      s.extraBlocks.splice(idx, 1);
      render(false);
    }
  }
  else if (a === "send-broadcast") {
    if (!currentUser || currentUser.email !== ADMIN_EMAIL) return;
    var bTitle = document.getElementById("adm-notif-title").value;
    var bMsg = document.getElementById("adm-notif-msg").value;
    if (!bTitle || !bMsg) { alert("Lütfen başlık ve mesaj giriniz."); return; }

    var annData = {
      title: bTitle,
      message: bMsg,
      date: firebase.firestore.FieldValue.serverTimestamp(),
      timeStr: new Date().toLocaleDateString("tr-TR") + " " + new Date().toLocaleTimeString("tr-TR", {hour: '2-digit', minute:'2-digit'})
    };

    if (typeof db !== "undefined") {
      db.collection("announcements").add(annData).then(function() {
        toast("Duyuru yayınlandı, bildirimler gönderiliyor.");
        document.getElementById("adm-notif-title").value = "";
        document.getElementById("adm-notif-msg").value = "";
      }).catch(function(err) { alert("Hata: " + err.message); });
    }
  }
  else if (a === "update-supp-submit") {
    if (!currentUser || currentUser.email !== ADMIN_EMAIL) return;
    var sName = document.getElementById("edit-name").value;
    if(!sName) { alert("Takviye adı boş olamaz."); return; }
    var sAlt = document.getElementById("edit-alt").value || "";
    var sSummary = document.getElementById("edit-summary").value || "";
    var sEv = parseInt(document.getElementById("edit-ev").value) || 3;
    var sDoseBig = document.getElementById("edit-dose-big").value || "1 Doz";
    
    var sWho = document.getElementById("edit-who").value.split(",").map(function(s){return s.trim();}).filter(Boolean);
    var sCare = document.getElementById("edit-care").value.split(",").map(function(s){return s.trim();}).filter(Boolean);
    var sDoes = document.getElementById("edit-does").value.split(",").map(function(s){return s.trim();}).filter(Boolean);

    var collectedBlocks = [];
    var blockEls = document.querySelectorAll("#extra-blocks-container [data-block-idx]");
    blockEls.forEach(function(bEl) {
      var tInput = bEl.querySelector(".eb-title").value;
      var thSelect = bEl.querySelector(".eb-theme").value;
      var itemsInput = bEl.querySelector(".eb-items").value.split(",").map(function(s){return s.trim();}).filter(Boolean);
      collectedBlocks.push({ title: tInput || "Özel Başlık", theme: thSelect, items: itemsInput });
    });

    var existingData = SUPPS[state.editId] || {};
    var updatedSuppData = Object.assign({}, existingData, {
      name: sName,
      alt: sAlt,
      summary: sSummary,
      ev: sEv,
      evLabel: sEv === 4 ? "Çok güçlü" : "Orta-Güçlü",
      dose: Object.assign({}, existingData.dose, { big: sDoseBig }),
      who: sWho.length ? sWho : ["Genel kullanım"],
      care: sCare.length ? sCare : ["Uzmanına danışınız."],
      does: sDoes.length ? sDoes : ["Destekleyici etki sağlar."],
      extraBlocks: collectedBlocks
    });

    if (typeof db !== "undefined") {
      db.collection("supplements").doc(state.editId).set(updatedSuppData, { merge: true }).then(function() {
        SUPPS[state.editId] = updatedSuppData;
        toast("Tüm şablonlar ve ek bloklar yayınlandı!");
        state.view = "home";
        render(true);
      }).catch(function(error) { alert("Güncelleme hatası: " + error.message); });
    }
  }
  else if (a === "remove-supp") { cancelSnoozesFor("supp", id); mine = mine.filter(function(x){return x.id!==id;}); saveUserData(); render(false); }
  else if (a === "remove-drug") { cancelSnoozesFor("drug", id); myDrugs = myDrugs.filter(function(x){return x.id!==id;}); saveUserData(); render(false); }
  else if (a === "toggle-slot") {
    var tType = el.dataset.type, tTime = el.dataset.time, te = findEntry(tType, id);
    if (te && te.times.indexOf(tTime) !== -1) {
      if (te.taken[tTime] === todayStr()) { delete te.taken[tTime]; }
      else { te.taken[tTime] = todayStr(); cancelSnoozesFor(tType, id, tTime); }
      saveUserData(); render(false);
    }
  }
  else if (a === "alarm-toggle") {
    var aType = el.dataset.type, ae = findEntry(aType, id);
    if (ae) {
      if (ae.alarm !== false) { openAlarmOffConfirm(aType, id); }
      else { ae.alarm = true; saveUserData(); render(false); toast("Alarm açıldı."); }
    }
  }
  else if (a === "alarm-off-confirm") {
    var oType = el.dataset.type, oe = findEntry(oType, id);
    if (oe) { oe.alarm = false; cancelSnoozesFor(oType, id); saveUserData(); }
    closeModal(); render(false); toast("Alarm kapatıldı.");
  }
  else if (a === "edit-item") { openWizard(el.dataset.type, id); }
  else if (a === "wz-day") {
    if (wiz) {
      var dn = parseInt(el.dataset.d, 10), di = wiz.days.indexOf(dn);
      if (di === -1) wiz.days.push(dn); else wiz.days.splice(di, 1);
      renderWizard();
    }
  }
  else if (a === "wz-preset") {
    if (wiz) {
      wiz.days = el.dataset.p === "week" ? [1, 2, 3, 4, 5] : (el.dataset.p === "end" ? [6, 7] : [1, 2, 3, 4, 5, 6, 7]);
      renderWizard();
    }
  }
  else if (a === "wz-per") {
    if (wiz) {
      var pn = parseInt(el.dataset.n, 10);
      if (pn !== wiz.per) { wiz.per = pn; wiz.times = DEF_TIMES[pn].slice(); }
      renderWizard();
    }
  }
  else if (a === "wz-next") { wizNext(); }
  else if (a === "wz-prev") { if (wiz && wiz.step > 1) { wiz.step--; renderWizard(); } }
  else if (a === "wz-cancel") { wiz = null; closeSheet(); }
  else if (a === "wz-alarm") { if (wiz) wiz.alarm = e.target.checked; }
  else if (a === "wz-confirm") { wizConfirm(); }
  else if (a === "save-new-supp") {
    if (!currentUser || currentUser.email !== ADMIN_EMAIL) return;
    var sName = document.getElementById("adm-name").value;
    if(!sName) { alert("Lütfen takviye adı giriniz."); return; }
    var sAlt = document.getElementById("adm-alt").value || "Özel Formül";
    var sSummary = document.getElementById("adm-summary").value || "Kişiselleştirilmiş destek ürünü.";
    var sEv = parseInt(document.getElementById("adm-ev").value) || 3;
    var sDoseBig = document.getElementById("adm-dose-big").value || "1 Doz";
    
    var sWho = document.getElementById("adm-who").value.split(",").map(function(s){return s.trim();}).filter(Boolean);
    if(sWho.length === 0) sWho = ["Genel yaşam kalitesini artırmak isteyenler"];
    var sCare = document.getElementById("adm-care").value.split(",").map(function(s){return s.trim();}).filter(Boolean);
    if(sCare.length === 0) sCare = ["Aksini belirtmedikçe uzman önerisiyle kullanılmalıdır."];
    var sDoes = document.getElementById("adm-does").value.split(",").map(function(s){return s.trim();}).filter(Boolean);
    if(sDoes.length === 0) sDoes = ["Metabolik süreçleri destekler."];

    var sKey = "supp_custom_" + Date.now();
    var newSuppData = {
      name: sName, alt: sAlt, summary: sSummary, ev: sEv,
      evLabel: sEv === 4 ? "Çok güçlü" : "Orta-Güçlü",
      who: sWho,
      care: sCare,
      does: sDoes,
      dose: { big: sDoseBig, per: "günde" },
      extraBlocks: []
    };

    if (typeof db !== "undefined") {
      db.collection("supplements").doc(sKey).set(newSuppData).then(function() {
        toast("Başarıyla veritabanına kaydedildi!");
        state.view = "home"; render(true);
      }).catch(function(error) { alert("Bulut kayıt hatası: " + error.message); });
    }
  }
  else if (a === "delete-cloud-supp") {
    if (!currentUser || currentUser.email !== ADMIN_EMAIL) return;
    if (confirm("Bu takviyeyi veritabanından silmek istediğinize emin misiniz?")) {
      if (typeof db !== "undefined") {
        db.collection("supplements").doc(id).delete().then(function() {
          delete SUPPS[id];
          toast("Takviye silindi.");
          render(false);
        });
      }
    }
  }
});

render(false);
</script>
</body>
</html>
